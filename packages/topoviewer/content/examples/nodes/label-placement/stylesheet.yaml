version: "0.2"
layout:
  mode: manual
  width: 660
  height: 340
icons:
  core:
    glyph: C
    fill: "#26313c"
    stroke: "#a3b0bd"
  edge:
    glyph: E
    fill: "#26313c"
    stroke: "#a3b0bd"
  db:
    glyph: DB
    fill: "#26313c"
    stroke: "#a3b0bd"
  service:
    glyph: API
    fill: "#26313c"
    stroke: "#a3b0bd"
stylesheet:
  - selector: node
    style:
      width: 120
      height: 76
      iconSize: 46
      borderWidth: 2
      labelColor: var(--topoviewer-fg-strong)
      labelFontWeight: 600
      labelBackgroundColor: var(--topoviewer-panel-bg)
      labelBackgroundOpacity: 0.94
      labelBorderColor: var(--topoviewer-border)
      labelBorderWidth: 1
      labelPadding: 4
      labelTextMaxWidth: 116
      labelTextOverflow: ellipsis
      labelFontSize: 14
      metaColor: transparent
      backgroundColor: var(--topoviewer-panel-bg)
      borderColor: var(--topoviewer-edge-default)
      iconColor: var(--topoviewer-fg-strong)
  - selector: node[labels.role = "core"]
    style:
      icon: core
      shape: hexagon
      labelPosition: top
      labelYOffset: -4
  - selector: node[labels.role = "edge"]
    style:
      icon: edge
      shape: roundRectangle
      labelPosition: right
      labelTextWrap: wrap
      labelTextMaxWidth: 96
  - selector: node[labels.role = "database"]
    style:
      icon: db
      shape: barrel
      labelPosition: left
      labelXOffset: -4
  - selector: node[labels.role = "service"]
    style:
      icon: service
      shape: ellipse
      labelPosition: center
      labelColor: "var(--topoviewer-fg-strong)"
      labelBackgroundColor: "color-mix(in srgb, var(--topoviewer-info) 12%,
        var(--topoviewer-panel-bg))"
      labelBackgroundOpacity: 0.9
  - selector: link
    style:
      curveStyle: bezier
      lineColor: "var(--topoviewer-edge-default)"
      lineWidth: 2
      targetArrowShape: none
      labelFontSize: 12
      labelFontWeight: 600
