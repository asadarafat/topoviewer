version: "0.2"
layout:
  mode: manual
  width: 640
  height: 320
icons:
  pe:
    glyph: PE
    fill: "#26313c"
    stroke: "#a3b0bd"
  firewall:
    glyph: FW
    fill: "#26313c"
    stroke: "#a3b0bd"
  app:
    glyph: APP
    fill: "#26313c"
    stroke: "#a3b0bd"
stylesheet:
  - selector: node
    style:
      width: 108
      height: 76
      iconSize: 52
      borderWidth: 2
      labelColor: var(--topoviewer-fg-strong)
      labelFontWeight: 600
      labelFontSize: 14
      metaColor: transparent
      backgroundColor: var(--topoviewer-panel-bg)
      borderColor: var(--topoviewer-edge-default)
      iconColor: var(--topoviewer-fg-strong)
  - selector: node[labels.role = "pe"]
    style:
      icon: pe
      shape: hexagon
  - selector: node[labels.state = "warning"]
    style:
      icon: firewall
      shape: cutRectangle
      borderStyle: dashed
      borderDashPattern: [ 7, 4 ]
      borderOpacity: 0.86
      outlineColor: "var(--topoviewer-warning)"
      outlineWidth: 4
      outlineOpacity: 0.74
      underlayColor: "color-mix(in srgb, var(--topoviewer-warning) 18%,
        var(--topoviewer-panel-bg))"
      underlayPadding: 10
      underlayOpacity: 0.65
  - selector: node[labels.state = "critical"]
    style:
      icon: app
      shape: roundRectangle
      borderStyle: dotted
      borderOpacity: 0.92
      outlineColor: "var(--topoviewer-danger)"
      outlineWidth: 5
      outlineOpacity: 0.82
      underlayColor: "color-mix(in srgb, var(--topoviewer-danger) 18%,
        var(--topoviewer-panel-bg))"
      underlayPadding: 12
      underlayOpacity: 0.7
  - selector: link
    style:
      lineColor: "var(--topoviewer-edge-default)"
      lineWidth: 2
      targetArrowShape: none
      labelFontSize: 12
      labelFontWeight: 600
