version: "0.2"
layout:
  mode: manual
  width: 760
  height: 340
icons:
  router:
    glyph: R
    fill: "#26313c"
    stroke: "#a3b0bd"
    svg: |
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="#f2f5f8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="48" height="48" rx="6" fill="#26313c" stroke="none"/><path d="M8 24h32M24 8v32M8 24l6-6m-6 6 6 6m26-6-6-6m6 6-6 6M24 8l-6 6m6-6 6 6M24 40l-6-6m6 6 6-6"/></svg>
    alt: Router
labelFields:
  - labels.name
stylesheet:
  - selector: node
    style:
      icon: router
      width: 82
      height: 64
      borderWidth: 2
      labelPosition: center
      labelColor: "var(--topoviewer-fg-strong)"
      labelFontWeight: 600
      labelBackgroundColor: "color-mix(in srgb, var(--topoviewer-accent) 12%, var(--topoviewer-panel-bg))"
      labelBackgroundOpacity: 0.96
      labelPadding: 4
      labelZIndex: 90
      labelFontSize: 14
      metaColor: transparent
      backgroundColor: var(--topoviewer-panel-bg)
      borderColor: var(--topoviewer-edge-default)
  - selector: link
    style:
      label: Transport
      sourceLabel: source side
      targetLabel: target side
      curveStyle: straight
      lineColor: "var(--topoviewer-edge-default)"
      lineWidth: 4
      labelColor: "var(--topoviewer-fg-strong)"
      textBackgroundColor: "color-mix(in srgb, var(--topoviewer-accent) 12%, var(--topoviewer-panel-bg))"
      labelBorderColor: "var(--topoviewer-accent)"
      labelBorderWidth: 1
      labelZIndex: 50
      sourceLabelColor: "var(--topoviewer-fg-strong)"
      sourceLabelBackgroundColor: "color-mix(in srgb, var(--topoviewer-info) 12%, var(--topoviewer-panel-bg))"
      sourceLabelZIndex: 100
      sourceLabelYOffset: -28
      targetLabelColor: "var(--topoviewer-fg-strong)"
      targetLabelBackgroundColor: "color-mix(in srgb, var(--topoviewer-danger) 12%, var(--topoviewer-panel-bg))"
      targetLabelZIndex: 100
      targetLabelYOffset: -28
      labelFontSize: 12
      labelFontWeight: 600
      endpointLabelDistance: 38
      endpointLabelSideOffset: 0
  - selector: region
    style:
      backgroundColor: var(--topoviewer-region-fill)
      borderColor: var(--topoviewer-region-stroke)
      borderWidth: 2
      labelPosition: topCenter
      labelMargin: 14
      labelColor: "var(--topoviewer-fg-strong)"
      labelBackgroundColor: "var(--topoviewer-edge-label-bg)"
      labelZIndex: 30
      zIndex: -20
      labelFontSize: 14
      labelFontWeight: 600
      headerPadding: 48
  - selector: region[id = "transport-domain"]
    style:
      paddingX: 74
      paddingY: 58
