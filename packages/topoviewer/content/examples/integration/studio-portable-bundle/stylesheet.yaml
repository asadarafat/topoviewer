version: "0.2"
layout:
  mode: manual
  width: 560
  height: 360
labelFields:
  - labels.name
stylesheet:
  - selector: node
    style:
      shape: rectangle
      width: 96
      height: 58
      borderWidth: 2
      labelFontSize: 14
      labelFontWeight: 600
      metaColor: transparent
      backgroundColor: var(--topoviewer-panel-bg)
      borderColor: var(--topoviewer-edge-default)
      iconColor: var(--topoviewer-fg-strong)
  - selector: link
    style:
      curveStyle: bezier
      lineColor: "var(--topoviewer-edge-default)"
      lineWidth: 3
      targetArrowShape: triangle
      labelFontSize: 12
      labelFontWeight: 600
