version: "0.2"
layout:
  mode: manual
  width: 1040
  height: 280
icons:
  source:
    glyph: SRC
    fill: "#26313c"
    stroke: "#a3b0bd"
  converter:
    glyph: CVT
    fill: "#26313c"
    stroke: "#a3b0bd"
  bundle:
    glyph: YAML
    fill: "#26313c"
    stroke: "#a3b0bd"
  surface:
    glyph: OUT
    fill: "#26313c"
    stroke: "#a3b0bd"
labelFields:
  - labels.name
stylesheet:
  - selector: node
    style:
      shape: rectangle
      width: 170
      height: 68
      borderWidth: 2
      iconFit: fill
      iconPadding: 0
      labelFontSize: 14
      labelFontWeight: 600
      labelColor: var(--topoviewer-fg-strong)
      labelBackgroundColor: var(--topoviewer-panel-bg)
      labelBackgroundOpacity: 0.92
      labelPadding: 4
      metaColor: transparent
      backgroundColor: var(--topoviewer-panel-bg)
      borderColor: var(--topoviewer-edge-default)
      iconColor: var(--topoviewer-fg-strong)
  - selector: node[labels.object = "source"]
    style:
      icon: source
      backgroundColor: "color-mix(in srgb, var(--topoviewer-accent) 12%,
        var(--topoviewer-panel-bg))"
      borderColor: "var(--topoviewer-accent)"
  - selector: node[labels.object = "converter"]
    style:
      icon: converter
      backgroundColor: "color-mix(in srgb, #8b78b8 12%, var(--topoviewer-panel-bg))"
      borderColor: "#8b78b8"
  - selector: node[labels.object = "bundle"]
    style:
      icon: bundle
      backgroundColor: "color-mix(in srgb, var(--topoviewer-info) 12%,
        var(--topoviewer-panel-bg))"
      borderColor: "var(--topoviewer-info)"
  - selector: node[labels.object = "surface"]
    style:
      icon: surface
      backgroundColor: "color-mix(in srgb, var(--topoviewer-warning) 12%,
        var(--topoviewer-panel-bg))"
      borderColor: "var(--topoviewer-warning)"
  - selector: link
    style:
      curveStyle: straight
      lineWidth: 4
      lineColor: "var(--topoviewer-edge-default)"
      targetArrowShape: triangle
      targetArrowColor: "var(--topoviewer-info)"
      labelColor: var(--topoviewer-fg-strong)
      labelFontSize: 12
      labelFontWeight: 600
      textBackgroundColor: var(--topoviewer-edge-label-bg)
      labelZIndex: 10
  - selector: link[labels.link = "contract"]
    style:
      lineColor: "var(--topoviewer-info)"
      targetArrowColor: "var(--topoviewer-info)"
