      target: deploy-eda-api
      labels:
        name: selects
        relation: selector
      data:
        provenance: captured-model
      layers: [service]
    - id: flow-svc-eda-cx-svc-eda-api
      source: svc-eda-cx
      target: svc-eda-api
      labels:
        name: sim control
        relation: control
      data:
        provenance: captured-model
      layers: [runtime]
    - id: authored-controller-runtime-context
      source: svc-eda-cx
      target: toponode-leaf1
