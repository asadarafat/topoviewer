        sourceId: toponode-leaf1
      layers: [runtime]
      position: [120, 430]
    - id: deploy-cx-eda-leaf1-sim
      labels:
        name: Simulator
        object: deployment
      data:
        detail: cx-eda--leaf1-sim Deployment; owns the simulator Pod
