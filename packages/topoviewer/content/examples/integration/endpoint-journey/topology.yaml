      target: pod-cx-eda-leaf1-sim-777d7654d8-rj7vt
      labels:
        name: owns
        relation: ownership
      data:
        provenance: captured-model
      layers: [runtime]
  regions:
    - id: managed-runtime
      labels:
        name: Managed runtime
      members:
        - toponode-leaf1
        - deploy-cx-eda-leaf1-sim
        - pod-cx-eda-leaf1-sim-777d7654d8-rj7vt
      layers: [runtime]
attention:
  aggregate:
    groups:
      - id: managed-runtime
        by: region
        regionId: managed-runtime
        label: Managed runtime
    expandOnClick: true
toggles:
  - id: showEdgeLabels
    default: true
    labels:
      name: Show relationship labels
