      layers: [service]
    - id: try-eda-to-eda-api
      source: svc-try-eda
      target: svc-eda-api
      labels:
        name: /api
        relation: route
      data:
        provenance: captured-model
      layers: [service]
    - id: selects-eda-api-eda-api
