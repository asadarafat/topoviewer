  labels:
    name: What sits behind this endpoint?
  data:
    provenance: Authored walkthrough using identities from the captured EDA service-map example.
    scope: Simplified relationships; not a live inventory or an observed request trace.
  layers:
    - id: service
      labels:
        name: Endpoint and workload
    - id: runtime
      labels:
        name: Managed runtime
  nodes:
    - id: client-browser
      labels:
        name: Browser
        object: client
      data:
        detail: Operator entry point
        subtitle: Operator
        sourceId: client-browser
      layers: [service]
      position: [20, 200]
    - id: svc-try-eda
      labels:
        name: try-eda
        object: service
        role: entry
      data:
        detail: NodePort service; HTTPS entry
        subtitle: NodePort
        sourceId: svc-try-eda
      layers: [service]
      position: [260, 200]
    - id: svc-eda-api
      labels:
        name: eda-api
        object: service
        role: api
      data:
        detail: API service; selects the API workload
        subtitle: Service
        sourceId: svc-eda-api
      layers: [service]
      position: [500, 200]
    - id: deploy-eda-api
      labels:
        name: API workload
        object: deployment
      data:
        detail: eda-api Deployment in eda-system
        subtitle: Deployment
        sourceName: eda-api
        sourceId: deploy-eda-api
      layers: [service]
      position: [740, 200]
    - id: svc-eda-cx
