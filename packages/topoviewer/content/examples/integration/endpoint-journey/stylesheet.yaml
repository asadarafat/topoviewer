version: "0.2"
layout:
  mode: manual
  width: 940
  height: 560
icons:
  client:
    alt: Browser client
    svg: |
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
    glyph: UI
    fill: "#102135"
    stroke: "#94a3b8"
  service:
    alt: Service endpoint
    svg: |
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#67e8f9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 5v10l-9 5-9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/></svg>
    glyph: SVC
    fill: "#123445"
    stroke: "#67e8f9"
  deployment:
    alt: Deployment
    svg: |
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#a5b4fc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="13" height="13" rx="2"/><rect x="8" y="8" width="13" height="13" rx="2" fill="#25244c"/><path d="M11 12h7M11 16h5"/></svg>
    glyph: DEP
    fill: "#25244c"
    stroke: "#a5b4fc"
  resource:
    alt: Managed topology resource
    svg: |
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#5eead4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M6 10h3M15 10h3M8 14l4-3 4 3M12 11v5"/></svg>
    glyph: CR
    fill: "#14392f"
    stroke: "#5eead4"
  pod:
    alt: Pod
    svg: |
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#5eead4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9zM4 7.5l8 4.5 8-4.5M12 12v9"/></svg>
    glyph: POD
    fill: "#14392f"
    stroke: "#5eead4"
  group:
    alt: Expandable runtime group
    svg: |
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#5eead4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="6" rx="1"/><rect x="2" y="16" width="8" height="6" rx="1"/><rect x="14" y="16" width="8" height="6" rx="1"/><path d="M12 8v4M6 16v-4h12v4"/></svg>
    glyph: MAP
    fill: "#14392f"
    stroke: "#5eead4"
labelFields:
  - labels.name
stylesheet:
  - selector: node
    style:
      shape: roundRectangle
      width: 168
      height: 82
      backgroundColor: "#102135"
      borderColor: "#475569"
      borderWidth: 2
      labelColor: "#f1f5f9"
      labelFontSize: 14
      labelFontWeight: 700
      metaFontSize: 12
      metaColor: "#94a3b8"
      iconColor: "#e2e8f0"
      nodeLayout:
        type: card
        direction: horizontal
        icon:
          placement: left
          width: 28
          height: 28
        content:
          align: left
          titleField: labels.name
          subtitleField: data.subtitle
  - selector: node[labels.object = "client"]
    style:
      icon: client
      borderColor: "#64748b"
  - selector: node[labels.object = "service"]
    style:
      icon: service
      borderColor: "#22d3ee"
  - selector: node[labels.object = "deployment"]
    style:
      icon: deployment
      borderColor: "#818cf8"
  - selector: node[labels.object = "toponode"]
    style:
      icon: resource
      borderColor: "#2dd4bf"
  - selector: node[labels.object = "pod"]
    style:
      icon: pod
      borderColor: "#2dd4bf"
  - selector: node[isAggregate = "true"][aggregateId = "managed-runtime"]
    style:
      icon: group
      width: 230
      height: 86
      backgroundColor: "#122d34"
      borderColor: "#2dd4bf"
      borderWidth: 2
      labelColor: "#f0fdfa"
      labelFontSize: 14
      metaFontSize: 0
      badgeColor: "#ccfbf1"
      badgeBackgroundColor: "#134e4a"
      badgeBorderColor: "#2dd4bf"
      badgeBorderWidth: 1
      badgeFontSize: 12
      badgeFontWeight: 700
      badgeMinWidth: 24
      badgeMinHeight: 24
      badgeOffset: 5
  - selector: link
    style:
      curveStyle: smooth-step
      lineColor: "#22d3ee"
      lineWidth: 2
      targetArrowShape: triangle
      targetArrowColor: "#22d3ee"
      labelColor: "#e2e8f0"
      labelFontSize: 12
      labelFontWeight: 600
      textBackgroundColor: "#0f172a"
      textBackgroundOpacity: 0.94
      textBackgroundPadding: 4
  - selector: link[labels.relation = "selector"]
    style:
      lineColor: "#2dd4bf"
      targetArrowColor: "#2dd4bf"
  - selector: link[labels.relation = "binding"]
    style:
      lineColor: "#2dd4bf"
      targetArrowColor: "#2dd4bf"
  - selector: link[labels.relation = "ownership"]
    style:
      lineColor: "#2dd4bf"
      targetArrowColor: "#2dd4bf"
  - selector: link[labels.relation = "control"]
    style:
      lineColor: "#64748b"
      targetArrowColor: "#94a3b8"
  - selector: link[labels.relation = "context"]
    style:
      lineColor: "#818cf8"
      targetArrowColor: "#818cf8"
      lineStyle: dashed
      lineDashPattern: 6 5
  - selector: link[isAggregate = "true"]
    style:
      lineColor: "#818cf8"
      targetArrowColor: "#818cf8"
      lineStyle: dashed
      lineDashPattern: 6 5
  - selector: region
    style:
      backgroundColor: "#312e8122"
      borderColor: "#818cf8"
      borderWidth: 1
      borderRadius: 14
      labelColor: "#a5b4fc"
      labelFontSize: 14
      labelFontWeight: 700
      padding: 24
      zIndex: -20
