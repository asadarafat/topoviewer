version: '0.2'
graph:
  id: grafana-telemetry-call-flow
  layers:
    - id: source
      labels:
        name: Source
    - id: telemetry
      labels:
        name: Telemetry
    - id: runtime
      labels:
        name: Grafana Runtime
    - id: diagnostics
      labels:
        name: Diagnostics
  nodes:
    - id: authoring-tool
      labels:
        kind: source
        role: authoring
        name: Studio
      data:
        detail: TopoViewer Studio used to author the portable source bundle.
      layers:
        - source
      position:
        - 110
        - 190
    - id: plugin-backend
      labels:
        kind: runtime
        role: backend
        name: Bundle API
      data:
        detail: Grafana backend resource endpoint that discovers, validates, and serves mounted TopoViewer bundles.
      layers:
        - runtime
      position:
        - 640
        - 190
    - id: prometheus-http-api
      labels:
        kind: telemetry
        role: datasource
        name: Prometheus API
      data:
        detail: Grafana calls Prometheus HTTP query endpoints and receives time-series samples.
      layers:
        - telemetry
      position:
        - 110
        - 620
    - id: plugin-frontend
      labels:
        kind: runtime
        role: frontend
        name: Panel Runtime
      data:
        detail: React panel runtime that coordinates source YAML, telemetry frames, mapper execution, and rendering.
      layers:
        - runtime
      position:
        - 920
        - 190
    - id: mapper-runtime
      labels:
        kind: runtime
        role: mapper
        name: Mapper
      data:
        detail: Resolves data-frame samples to TopoViewer objects and runtime states.
      layers:
        - runtime
      position:
        - 920
        - 390
    - id: topoviewer-renderer
      labels:
        kind: runtime
        role: renderer
        name: Renderer
      data:
        detail: TopoViewer renderer embedded in the panel plugin.
      layers:
        - runtime
      position:
        - 1220
        - 190
    - id: source-diagnostics
      labels:
        kind: diagnostic
        role: source-diagnostics
        name: Source Diagnostics
      data:
        detail: Source discovery, parse, schema, and bundle-selection diagnostics produced by the plugin backend.
      layers:
        - diagnostics
        - runtime
      position:
        - 640
        - 390
    - id: runtime-diagnostics
      labels:
        kind: diagnostic
        role: runtime-diagnostics
        name: Runtime Diagnostics
      data:
        detail: Mapper coverage, telemetry matching, overlay, and render diagnostics surfaced by the panel runtime.
      layers:
        - diagnostics
        - runtime
      position:
        - 1220
        - 390
    - id: mounted-bundle
      labels:
        kind: artifact
        role: bundle
        name: Mounted YAML
      data:
        detail: >-
          Portable bundle exported from Studio and mounted by an operator/deployment; not a live
          Studio-to-Grafana API.
      layers:
        - source
      position:
        - 370
        - 190
    - id: grafana-datasource
      labels:
        kind: runtime
        role: datasource
        name: Grafana data source
      data:
        detail: >-
          Grafana queries Prometheus via its data source; PanelProps.data.series supplies resulting data
          frames to the panel.
      layers:
        - telemetry
        - runtime
      position:
        - 640
        - 620
  links:
    - id: export-and-mount
      source: authoring-tool
      target: mounted-bundle
      labels:
        flow: manual
        route: straight
        name: export / mount
      layers:
        - source
    - id: bundle-files-to-backend
      source: mounted-bundle
      target: plugin-backend
      labels:
        flow: source
        route: straight
        name: 1 · read YAML
      layers:
        - source
        - runtime
    - id: prometheus-to-datasource
      source: prometheus-http-api
      target: grafana-datasource
      labels:
        flow: telemetry
        route: straight
        name: 3a · query results
      data:
        detail: Response data direction; Grafana sends the query request in the opposite direction.
      layers:
        - telemetry
    - id: datasource-to-frontend
      source: grafana-datasource
      target: plugin-frontend
      labels:
        flow: telemetry
        route: smooth-taxi
        name: 3b · data frames
      layers:
        - telemetry
        - runtime
      sourceHandle: shape-port-2
      targetHandle: shape-port-4
    - id: backend-to-frontend
      source: plugin-backend
      target: plugin-frontend
      labels:
        flow: source
        route: straight
        name: 2 · bundle YAML
      layers:
        - runtime
    - id: frontend-to-mapper
      source: plugin-frontend
      target: mapper-runtime
      labels:
        flow: mapping
        route: straight
        name: 4 · frames + rules
      layers:
        - runtime
    - id: frontend-to-renderer
      source: plugin-frontend
      target: topoviewer-renderer
      labels:
        flow: render
        route: straight
        name: 5 · graph + style
      layers:
        - runtime
    - id: mapper-to-renderer
      source: mapper-runtime
      target: topoviewer-renderer
      labels:
        flow: overlay
        route: straight
        name: 6 · overlay
      layers:
        - runtime
    - id: mapper-to-diagnostics
      source: mapper-runtime
      target: runtime-diagnostics
      labels:
        flow: diagnostic
        route: straight
        name: 7 · coverage
      layers:
        - diagnostics
    - id: backend-to-diagnostics
      source: plugin-backend
      target: source-diagnostics
      labels:
        flow: diagnostic
        route: straight
        name: 8 · source errors
      layers:
        - diagnostics
  regions:
    - id: source-region
      labels:
        region: lane
        lane: source
        name: Authoring
      members:
        - authoring-tool
        - mounted-bundle
      layers:
        - source
    - id: telemetry-region
      labels:
        region: lane
        lane: telemetry
        name: Prometheus
      members:
        - prometheus-http-api
      layers:
        - telemetry
    - id: grafana-region
      labels:
        region: boundary
        lane: grafana
        name: Grafana
      members:
        - plugin-backend
        - plugin-frontend
        - mapper-runtime
        - topoviewer-renderer
        - source-diagnostics
        - runtime-diagnostics
        - grafana-datasource
      layers:
        - runtime
        - diagnostics
    - id: backend-region
      labels:
        region: lane
        lane: backend
        name: Bundle backend
      parent: grafana-region
      members:
        - plugin-backend
        - source-diagnostics
      layers:
        - runtime
        - diagnostics
    - id: frontend-region
      labels:
        region: lane
        lane: frontend
        name: Panel frontend
      parent: grafana-region
      members:
        - plugin-frontend
        - mapper-runtime
        - topoviewer-renderer
        - runtime-diagnostics
      layers:
        - runtime
  data:
    scope: >-
      Component data flow, not a packet trace or timing diagram. Arrow labels name payloads; dashed links
      indicate manual transfer or diagnostics.
toggles:
  - id: showEdgeLabels
    default: true
    labels:
      name: Edge labels
