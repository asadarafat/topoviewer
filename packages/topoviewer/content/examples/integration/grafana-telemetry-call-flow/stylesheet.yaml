version: '0.2'
layout:
  mode: manual
  width: 1420
  height: 830
icons:
  authoring:
    glyph: YAML
    fill: '#26313c'
    stroke: '#a3b0bd'
  backend:
    glyph: API
    fill: '#26313c'
    stroke: '#a3b0bd'
  frontend:
    glyph: UI
    fill: '#26313c'
    stroke: '#a3b0bd'
  mapper:
    glyph: MAP
    fill: '#26313c'
    stroke: '#a3b0bd'
  renderer:
    glyph: TV
    fill: '#26313c'
    stroke: '#a3b0bd'
  prometheus:
    glyph: P
    fill: '#26313c'
    stroke: '#a3b0bd'
  diagnostics:
    glyph: '!'
    fill: '#26313c'
    stroke: '#a3b0bd'
labelFields:
  - labels.name
stylesheet:
  - selector: region
    style:
      backgroundColor: var(--topoviewer-region-fill)
      borderColor: var(--topoviewer-region-stroke)
      borderWidth: 2
      labelPosition: topLeft
      labelMargin: 12
      labelColor: var(--topoviewer-region-label-fg)
      labelBackgroundColor: var(--topoviewer-region-label-bg)
      labelFontSize: 16
      labelFontWeight: 600
      labelZIndex: 40
      zIndex: -30
      headerPadding: 48
  - selector: region[labels.lane = "telemetry"]
    style:
      backgroundColor: color-mix(in srgb, var(--topoviewer-warning) 5%, var(--topoviewer-panel-bg))
      borderColor: var(--topoviewer-region-stroke)
  - selector: region[labels.lane = "backend"]
    style:
      backgroundColor: 'color-mix(in srgb, #8b78b8 5%, var(--topoviewer-panel-bg))'
      borderColor: var(--topoviewer-region-stroke)
      labelFontSize: 15
  - selector: region[labels.lane = "frontend"]
    style:
      backgroundColor: color-mix(in srgb, var(--topoviewer-info) 5%, var(--topoviewer-panel-bg))
      borderColor: var(--topoviewer-region-stroke)
      labelFontSize: 15
  - selector: region[labels.lane = "grafana"]
    style:
      backgroundColor: color-mix(in srgb, var(--topoviewer-info) 5%, var(--topoviewer-panel-bg))
      borderColor: var(--topoviewer-region-stroke)
      borderWidth: 2
      labelPosition: topCenter
      labelMargin: 12
      labelZIndex: 30
      zIndex: -45
  - selector: node
    style:
      shape: rectangle
      width: 190
      height: 58
      borderWidth: 2
      iconWidth: 48
      iconHeight: 48
      iconFit: contain
      iconPadding: 0
      iconOpacity: 0
      labelPosition: center
      labelColor: var(--topoviewer-fg-strong)
      labelBackgroundColor: transparent
      labelBackgroundOpacity: 0
      labelBorderWidth: 0
      labelFontSize: 16
      labelFontWeight: 600
      labelZIndex: 50
      labelPadding: 0
      labelTextMaxWidth: 182
      labelTextWrap: none
      labelTextOverflow: clip
      metaColor: transparent
      zIndex: 20
      backgroundColor: var(--topoviewer-panel-bg)
      borderColor: var(--topoviewer-edge-default)
      iconColor: var(--topoviewer-fg-strong)
      labelCollisionPolicy: none
  - selector: node[labels.role = "authoring"]
    style:
      icon: authoring
      backgroundColor: color-mix(in srgb, var(--topoviewer-accent) 12%, var(--topoviewer-panel-bg))
      borderColor: var(--topoviewer-accent)
  - selector: node[labels.role = "backend"]
    style:
      icon: backend
      backgroundColor: 'color-mix(in srgb, #8b78b8 12%, var(--topoviewer-panel-bg))'
      borderColor: '#8b78b8'
  - selector: node[labels.role = "frontend"]
    style:
      icon: frontend
      backgroundColor: 'color-mix(in srgb, #8b78b8 12%, var(--topoviewer-panel-bg))'
      borderColor: '#8b78b8'
  - selector: node[labels.role = "mapper"]
    style:
      icon: mapper
      backgroundColor: color-mix(in srgb, var(--topoviewer-info) 12%, var(--topoviewer-panel-bg))
      borderColor: var(--topoviewer-info)
  - selector: node[labels.role = "renderer"]
    style:
      icon: renderer
      backgroundColor: color-mix(in srgb, var(--topoviewer-info) 12%, var(--topoviewer-panel-bg))
      borderColor: var(--topoviewer-info)
      outlineColor: var(--topoviewer-info)
      outlineWidth: 4
      outlineOpacity: 0.3
  - selector: node[labels.role = "datasource"]
    style:
      icon: prometheus
      backgroundColor: color-mix(in srgb, var(--topoviewer-danger) 12%, var(--topoviewer-panel-bg))
      borderColor: var(--topoviewer-danger)
  - selector: node[labels.kind = "diagnostic"]
    style:
      icon: diagnostics
      backgroundColor: color-mix(in srgb, var(--topoviewer-danger) 12%, var(--topoviewer-panel-bg))
      borderColor: var(--topoviewer-danger)
      width: 204
      labelTextMaxWidth: 196
  - selector: link
    style:
      curveStyle: straight
      lineColor: var(--topoviewer-edge-default)
      lineWidth: 2
      lineCap: round
      targetArrowShape: triangle
      targetArrowColor: var(--topoviewer-info)
      targetArrowSize: 10
      targetArrowOffset: 0
      sourceArrowShape: none
      labelColor: var(--topoviewer-fg-strong)
      labelFontSize: 15
      labelFontWeight: 600
      labelZIndex: 80
      textBackgroundColor: var(--topoviewer-edge-label-bg)
      textBackgroundOpacity: 1
      textBackgroundPadding: 4
      labelBorderColor: color-mix(in srgb, var(--topoviewer-accent) 18%, transparent)
      labelBorderWidth: 1
      zIndex: 45
      labelYOffset: -46
  - selector: link[labels.route = "smooth-taxi"]
    style:
      curveStyle: smooth-taxi
      taxiDirection: horizontal
      taxiTurn: 50%
      taxiTurnMinDistance: 90
  - selector: link[labels.flow = "source"]
    style:
      lineColor: var(--topoviewer-accent)
      targetArrowColor: var(--topoviewer-accent)
      labelColor: var(--topoviewer-fg-strong)
  - selector: link[labels.flow = "telemetry"]
    style:
      lineColor: var(--topoviewer-warning)
      targetArrowColor: var(--topoviewer-warning)
      labelColor: var(--topoviewer-fg-strong)
  - selector: link[labels.flow = "mapping"]
    style:
      lineColor: var(--topoviewer-info)
      targetArrowColor: var(--topoviewer-info)
      labelColor: var(--topoviewer-fg-strong)
  - selector: link[labels.flow = "overlay"]
    style:
      lineColor: var(--topoviewer-info)
      targetArrowColor: var(--topoviewer-info)
      lineWidth: 3
      labelColor: var(--topoviewer-fg-strong)
      targetArrowSize: 16
      targetArrowOffset: 0
  - selector: link[labels.flow = "render"]
    style:
      lineColor: '#8b78b8'
      targetArrowColor: '#8b78b8'
      labelColor: var(--topoviewer-fg-strong)
  - selector: link[labels.flow = "diagnostic"]
    style:
      lineColor: var(--topoviewer-danger)
      targetArrowColor: var(--topoviewer-danger)
      lineStyle: dashed
      lineDashPattern: 9 7
      lineWidth: 3
      labelColor: var(--topoviewer-fg-strong)
  - selector: region[id = "source-region"]
    style:
      paddingX: 34
      paddingY: 48
  - selector: region[id = "telemetry-region"]
    style:
      paddingX: 42
      paddingY: 56
  - selector: region[id = "grafana-region"]
    style:
      headerPadding: 82
      paddingX: 32
      paddingY: 38
      parentPaddingX: 28
      parentPaddingY: 28
  - selector: region[id = "backend-region"]
    style:
      paddingX: 42
      paddingY: 62
  - selector: region[id = "frontend-region"]
    style:
      paddingX: 48
      paddingY: 64
  - selector: link[labels.flow = "manual"]
    style:
      lineStyle: dashed
      lineColor: var(--topoviewer-accent)
      targetArrowColor: var(--topoviewer-accent)
  - selector: node[labels.kind = "artifact"]
    style:
      shape: cutRectangle
      borderColor: var(--topoviewer-accent)
  - selector: link[id = "datasource-to-frontend"]
    style:
      taxiDirection: horizontal
      taxiTurn: 50%
      taxiTurnMinDistance: 0
      labelXOffset: 0
      labelYOffset: 80
