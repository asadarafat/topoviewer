version: '0.2'
layout:
  mode: manual
  width: 900
  height: 590
icons:
  router:
    alt: Router
    svg: >-
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect x="4" y="7" width="32" height="26" rx="7" fill="#263b40" stroke="#87b6af" stroke-width="1.5"/><path d="M11 15h18M11 25h18M15 11l-4 4 4 4m10 2 4 4-4 4" fill="none" stroke="#c5dfd9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  application:
    alt: Application service
    svg: >-
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect x="5" y="5" width="30" height="30" rx="8" fill="#263b36" stroke="#87b6af" stroke-width="1.5"/><path d="m11 20 6 6 12-12" fill="none" stroke="#c5dfd9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
  protection:
    alt: Protected alternative route
    svg: >-
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><path d="m20 4 13 5v11c0 8-7 13-13 16C14 33 7 28 7 20V9Z" fill="#26313c" stroke="#a3b0bd" stroke-width="1.5"/><path d="m13 20 5 5 9-10" fill="none" stroke="#e6edf3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
labelFields:
  - labels.name
stylesheet:
  - selector: node
    style:
      shape: roundRectangle
      width: 194
      height: 70
      backgroundColor: 'var(--topoviewer-panel-bg)'
      borderColor: 'var(--topoviewer-edge-default)'
      borderWidth: 1.5
      icon: router
      iconPadding: 0
      labelColor: 'var(--topoviewer-fg-strong)'
      labelFontSize: 14
      labelFontWeight: 600
      metaColor: 'var(--topoviewer-fg-muted)'
      metaFontSize: 12
      metaFontWeight: 500
      statusColor: 'var(--topoviewer-success)'
      statusSize: 9
      statusPlacement: topRight
      nodeLayout:
        type: card
        direction: horizontal
        icon:
          placement: left
          width: 34
          height: 34
        content:
          align: left
          titleField: labels.name
          subtitleField: data.subtitle
      draggable: false
  - selector: node[labels.role = "application"]
    style:
      icon: application
      borderColor: 'var(--topoviewer-info)'
      backgroundColor: 'color-mix(in srgb, var(--topoviewer-info) 12%, var(--topoviewer-panel-bg))'
  - selector: node[labels.role = "protection"]
    style:
      icon: protection
      borderColor: 'var(--topoviewer-accent)'
      statusColor: 'var(--topoviewer-fg-muted)'
  - selector: node[data.severity = "major"]
    style:
      borderColor: 'var(--topoviewer-warning)'
      statusColor: 'var(--topoviewer-warning)'
      outlineColor: 'var(--topoviewer-warning)'
      outlineWidth: 1.5
  - selector: node[labels.state = "protected"]
    style:
      borderColor: 'var(--topoviewer-info)'
      statusColor: 'var(--topoviewer-success)'
  - selector: link
    style:
      curveStyle: straight
      lineColor: 'var(--topoviewer-edge-default)'
      lineWidth: 2.5
      labelFontSize: 12
      labelColor: var(--topoviewer-fg-strong)
      textBackgroundColor: var(--topoviewer-edge-label-bg)
      targetArrowShape: none
      labelCollisionPolicy: avoid
      zIndex: 2
      opacity: 0.48
      labelFontWeight: 600
  - selector: link[labels.corridor = "protection"]
    style:
      lineStyle: dashed
      lineDashPattern: 6 7
      lineColor: 'var(--topoviewer-accent)'
      lineWidth: 2
  - selector: link[labels.state = "down"]
    style:
      lineColor: 'var(--topoviewer-danger)'
      lineWidth: 4
      lineStyle: dashed
      lineDashPattern: 4 5
      labelColor: 'var(--topoviewer-fg-strong)'
      opacity: 1
  - selector: path
    style:
      label: ''
      curveStyle: bezier
      lineColor: 'var(--topoviewer-info)'
      lineWidth: 5
      opacity: 1
      targetArrowShape: triangle
      targetArrowSize: 7
      targetArrowColor: 'var(--topoviewer-info)'
      zIndex: 8
      controlPointDistance: 30
      controlPointWeight: 0.5
      labelFontSize: 12
      labelFontWeight: 600
  - selector: path[labels.state = "impacted"]
    style:
      lineColor: 'var(--topoviewer-warning)'
      targetArrowColor: 'var(--topoviewer-warning)'
      lineStyle: dashed
      lineDashPattern: 10 6
  - selector: path[labels.state = "protected"]
    style:
      lineColor: 'var(--topoviewer-info)'
      targetArrowColor: 'var(--topoviewer-info)'
  - selector: region
    style:
      width: 250
      height: 480
      shape: roundRectangle
      backgroundColor: var(--topoviewer-region-fill)
      borderColor: 'var(--topoviewer-region-stroke)'
      borderWidth: 1
      labelPosition: topCenter
      labelMargin: 20
      labelFontSize: 14
      labelFontWeight: 600
      labelColor: var(--topoviewer-fg-strong)
      labelBackgroundColor: var(--topoviewer-region-label-bg)
      selectable: false
      draggable: false
      zIndex: -20
      headerPadding: 48
  - selector: callout
    style:
      width: 214
      height: 112
      backgroundColor: 'color-mix(in srgb, var(--topoviewer-accent) 12%, var(--topoviewer-panel-bg))'
      borderColor: 'var(--topoviewer-info)'
      borderWidth: 1
      borderRadius: 8
      titleColor: 'var(--topoviewer-fg-strong)'
      titleBackgroundColor: 'color-mix(in srgb, var(--topoviewer-accent) 18%, var(--topoviewer-panel-bg))'
      titleFontSize: 14
      titleFontWeight: 600
      bodyColor: 'var(--topoviewer-fg-muted)'
      bodyFontSize: 13
      bodyLineHeight: 1.5
      textAlign: left
      draggable: false
      boxShadow: none
  - selector: callout[labels.state = "impacted"]
    style:
      titleColor: 'var(--topoviewer-fg-strong)'
      borderColor: 'var(--topoviewer-warning)'
  - selector: callout[labels.state = "protected"]
    style:
      titleColor: 'var(--topoviewer-fg-strong)'
      borderColor: 'var(--topoviewer-info)'
