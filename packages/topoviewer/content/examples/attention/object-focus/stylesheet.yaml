version: "0.2"
layout:
  mode: manual
  width: 620
  height: 420
icons:
  endpoint:
    glyph: C
    fill: "#26313c"
    stroke: "#a3b0bd"
  gateway:
    glyph: G
    fill: "#26313c"
    stroke: "#a3b0bd"
  service:
    glyph: API
    fill: "#26313c"
    stroke: "#a3b0bd"
  support:
    glyph: S
    fill: "#26313c"
    stroke: "#a3b0bd"
labelFields:
  - labels.name
stylesheet:
  - selector: node
    style:
      width: 86
      height: 60
      borderWidth: 2
      labelColor: var(--topoviewer-fg-strong)
      labelFontWeight: 600
      labelFontSize: 14
      metaColor: transparent
      backgroundColor: var(--topoviewer-panel-bg)
      borderColor: var(--topoviewer-edge-default)
      iconColor: var(--topoviewer-fg-strong)
  - selector: node[labels.role = "endpoint"]
    style:
      icon: endpoint
  - selector: node[labels.role = "gateway"]
    style:
      icon: gateway
  - selector: node[labels.role = "service"]
    style:
      icon: service
  - selector: node[labels.role = "support"]
    style:
      icon: support
  - selector: link
    style:
      curveStyle: smooth-step
      lineColor: "var(--topoviewer-edge-default)"
      lineWidth: 1.5
      targetArrowShape: none
      opacity: 0.72
      labelFontSize: 12
      labelFontWeight: 600
  - selector: link[labels.link = "support"]
    style:
      lineDashPattern: 5 5
  - selector: path
    style:
      label: Checkout flow
      curveStyle: smooth-taxi
      lineColor: "var(--topoviewer-info)"
      lineWidth: 4
      animated: true
      targetArrowShape: triangle
      labelFontSize: 12
      labelFontWeight: 600
