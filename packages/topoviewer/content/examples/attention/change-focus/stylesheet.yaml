version: "0.2"
layout:
  mode: manual
  width: 700
  height: 420
icons:
  router:
    glyph: R
    fill: "#26313c"
    stroke: "#a3b0bd"
    svg: |
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="#f2f5f8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="48" height="48" rx="6" fill="#26313c" stroke="none"/><path d="M8 24h32M24 8v32M8 24l6-6m-6 6 6 6m26-6-6-6m6 6-6 6M24 8l-6 6m6-6 6 6M24 40l-6-6m6 6 6-6"/></svg>
    alt: Router
  controller:
    glyph: NOC
    fill: "#26313c"
    stroke: "#a3b0bd"
labelFields:
  - labels.name
stylesheet:
  - selector: node
    style:
      icon: router
      width: 82
      height: 60
      borderWidth: 2
      labelColor: var(--topoviewer-fg-strong)
      labelFontWeight: 600
      labelFontSize: 14
      metaColor: transparent
      backgroundColor: var(--topoviewer-panel-bg)
      borderColor: var(--topoviewer-edge-default)
      iconColor: var(--topoviewer-fg-strong)
  - selector: node[labels.role = "control"]
    style:
      icon: controller
      width: 92
      borderColor: "var(--topoviewer-warning)"
      backgroundColor: "color-mix(in srgb, var(--topoviewer-warning) 12%,
        var(--topoviewer-panel-bg))"
  - selector: node[data.severity = "major"]
    style:
      borderColor: "var(--topoviewer-warning)"
      backgroundColor: "color-mix(in srgb, var(--topoviewer-warning) 12%,
        var(--topoviewer-panel-bg))"
  - selector: link
    style:
      curveStyle: smooth-step
      lineColor: "var(--topoviewer-edge-default)"
      lineWidth: 1.6
      targetArrowShape: none
      opacity: 0.78
      labelFontSize: 12
      labelFontWeight: 600
  - selector: link[labels.protocol = "telemetry"]
    style:
      label: Telemetry
      curveStyle: bezier
      lineColor: "var(--topoviewer-info)"
      lineDashPattern: 3 4
      targetArrowShape: triangle
  - selector: link[data.status = "degraded"]
    style:
      lineColor: "var(--topoviewer-warning)"
      lineWidth: 3
