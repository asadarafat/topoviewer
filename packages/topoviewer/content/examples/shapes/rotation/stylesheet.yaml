version: "0.2"
layout:
  mode: manual
  width: 700
  height: 340
stylesheet:
  - selector: shape
    style:
      fill: color-mix(in srgb, var(--topoviewer-info) 16%, var(--topoviewer-panel-bg))
      stroke: color-mix(in srgb, var(--topoviewer-info) 86%, transparent)
      borderWidth: 2
      labelFontSize: 14
      labelFontWeight: 600
      bodyFontSize: 13
      bodyLineHeight: 1.5
  - selector: shape[labels.geometry = "star"]
    style:
      shape: star
      width: 86
      height: 86
      rotation: 18
  - selector: shape[labels.geometry = "cuboid"]
    style:
      shape: cuboid
      width: 110
      height: 64
  - selector: shape[labels.geometry = "square"]
    style:
      shape: square
      width: 76
      height: 76
  - selector: shape[labels.rotation = "styled"]
    style:
      rotation: -6
      fill: "color-mix(in srgb, #8b78b8 16%, var(--topoviewer-panel-bg))"
      stroke: "color-mix(in srgb, #8b78b8 86%, transparent)"
