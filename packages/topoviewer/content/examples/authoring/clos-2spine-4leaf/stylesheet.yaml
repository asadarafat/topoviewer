labelFields:
  - labels.name
stylesheet:
  - selector: region
    style:
      labelZIndex: 9
      backgroundColor: "var(--topoviewer-region-fill)"
      borderColor: "var(--topoviewer-region-stroke)"
      borderWidth: 2
      labelPosition: topCenter
      labelMargin: 12
      labelColor: var(--topoviewer-region-label-fg)
      labelBackgroundColor: var(--topoviewer-region-label-bg)
      labelFontSize: 14
      labelFontWeight: 600
      headerPadding: 48
  - selector: node
    style:
      icon: router.leaf
      shape: square
      width: 48
      height: 48
      borderWidth: 2
      borderColor: "var(--topoviewer-edge-default)"
      iconFit: fill
      iconPadding: 0
      labelFontWeight: 600
      labelColor: var(--topoviewer-fg-strong)
      labelBackgroundColor: var(--topoviewer-panel-bg)
      labelBackgroundOpacity: 0.92
      labelBorderColor: var(--topoviewer-border)
      labelBorderWidth: 1
      labelZIndex: 10
      labelYOffset: 8
      labelPadding: 4
      metaColor: "transparent"
      labelFontSize: 14
      backgroundColor: var(--topoviewer-panel-bg)
  - selector: node[labels.node = "spine"]
    style:
      icon: router.spine
      outlineColor: "#8b78b8"
      outlineWidth: 4
      outlineOpacity: 0.55
      labelPosition: top
      labelYOffset: -8
  - selector: node[labels.node = "leaf"]
    style:
      icon: router.leaf
      outlineColor: "var(--topoviewer-accent)"
      outlineWidth: 3
      outlineOpacity: 0.38
  - selector: link
    style:
      lineWidth: 4
      lineColor: "var(--topoviewer-edge-default)"
      targetArrowShape: none
      curveStyle: straight
      label: ""
      textBackgroundColor: var(--topoviewer-edge-label-bg)
      labelFontSize: 12
      labelFontWeight: 600
  - selector: region[id = "spine-pair"]
    style:
      paddingX: 48
      paddingY: 44
  - selector: region[id = "leaf-pair-1"]
    style:
      paddingX: 40
      paddingY: 38
  - selector: region[id = "leaf-pair-2"]
    style:
      paddingX: 40
      paddingY: 38
