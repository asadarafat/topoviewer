version: "0.2"
layout:
  mode: tree
  width: 820
  height: 460
  tree:
    direction: leftToRight
    levelGap: 190
    nodeGap: 100
    componentGap: 80
icons:
  service:
    glyph: SVC
    fill: "#26313c"
    stroke: "#a3b0bd"
labelFields:
  - labels.name
stylesheet:
  - selector: node
    style:
      icon: service
      shape: roundRectangle
      width: 92
      height: 58
      borderWidth: 2
      labelColor: var(--topoviewer-fg-strong)
      labelFontWeight: 600
      labelFontSize: 14
      metaColor: transparent
      labelPosition: top
      backgroundColor: var(--topoviewer-panel-bg)
      borderColor: var(--topoviewer-edge-default)
      iconColor: var(--topoviewer-fg-strong)
  - selector: link
    style:
      curveStyle: bezier
      lineColor: "var(--topoviewer-edge-default)"
      lineWidth: 2
      targetArrowShape: triangle
      labelFontSize: 12
      labelFontWeight: 600
