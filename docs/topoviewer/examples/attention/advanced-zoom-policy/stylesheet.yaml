version: '0.2'
icons:
  router:
    glyph: R
    fill: '#26313c'
    stroke: '#a3b0bd'
    svg: >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="#f2f5f8"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="48" height="48"
      rx="6" fill="#26313c" stroke="none"/><path d="M8 24h32M24 8v32M8 24l6-6m-6 6 6 6m26-6-6-6m6 6-6 6M24
      8l-6 6m6-6 6 6M24 40l-6-6m6 6 6-6"/></svg>
    alt: Router
labelFields:
  - labels.name
stylesheet:
  - selector: node
    style:
      icon: router
      width: 82
      height: 60
      borderWidth: 2
      labelColor: var(--topoviewer-fg-strong)
      labelFontWeight: 600
      labelFontSize: 14
      metaColor: transparent
      backgroundColor: var(--topoviewer-panel-bg)
      borderColor: var(--topoviewer-edge-default)
  - selector: node[isAggregate = "true"]
    style:
      width: 132
      height: 78
      backgroundColor: color-mix(in srgb, var(--topoviewer-accent) 12%, var(--topoviewer-panel-bg))
      borderColor: var(--topoviewer-accent)
      labelColor: var(--topoviewer-fg-strong)
  - selector: link
    style:
      curveStyle: smooth-step
      lineColor: var(--topoviewer-edge-default)
      lineWidth: 2.2
      targetArrowShape: none
      opacity: 0.82
      labelFontSize: 12
      labelFontWeight: 600
  - selector: link[isAggregate = "true"]
    style:
      lineColor: '#8b78b8'
      lineWidth: 4
      lineDashPattern: 10 5
  - selector: region
    style:
      backgroundColor: var(--topoviewer-region-fill)
      borderColor: var(--topoviewer-region-stroke)
      borderRadius: 6
      borderWidth: 1
      zIndex: -20
      labelFontSize: 14
      labelFontWeight: 600
      headerPadding: 48
  - selector: region[id = "west-metro"]
    style:
      minHeight: 210
      minWidth: 330
      padding: 70
  - selector: region[id = "east-metro"]
    style:
      minHeight: 210
      minWidth: 330
      padding: 70
layout:
  mode: manual
  width: 1120
  height: 300
