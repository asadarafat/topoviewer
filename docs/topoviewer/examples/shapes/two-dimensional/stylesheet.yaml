version: '0.2'
layout:
  mode: manual
  width: 820
  height: 360
stylesheet:
  - selector: shape
    style:
      fill: color-mix(in srgb, var(--topoviewer-info) 16%, var(--topoviewer-panel-bg))
      stroke: color-mix(in srgb, var(--topoviewer-info) 86%, transparent)
      borderWidth: 2
      width: 70
      height: 70
      selectable: true
      zIndex: 8
      labelFontSize: 14
      labelFontWeight: 600
      bodyFontSize: 13
      bodyLineHeight: 1.5
      labelColor: transparent
  - selector: shape[labels.geometry = "circle"]
    style:
      shape: circle
  - selector: shape[labels.geometry = "triangle"]
    style:
      shape: triangle
  - selector: shape[labels.geometry = "square"]
    style:
      shape: square
  - selector: shape[labels.geometry = "rectangle"]
    style:
      shape: rectangle
      width: 90
      height: 58
  - selector: shape[labels.geometry = "pentagon"]
    style:
      shape: pentagon
  - selector: shape[labels.geometry = "hexagon"]
    style:
      shape: hexagon
  - selector: shape[labels.geometry = "octagon"]
    style:
      shape: octagon
  - selector: shape[labels.geometry = "ellipse"]
    style:
      shape: ellipse
      width: 90
      height: 58
  - selector: shape[labels.geometry = "semicircle"]
    style:
      shape: semicircle
  - selector: shape[labels.geometry = "trapezoid"]
    style:
      shape: trapezoid
  - selector: shape[labels.geometry = "parallelogram"]
    style:
      shape: parallelogram
  - selector: shape[labels.geometry = "rhombus"]
    style:
      shape: rhombus
  - selector: shape[labels.geometry = "kite"]
    style:
      shape: kite
  - selector: shape[labels.geometry = "star"]
    style:
      shape: star
  - selector: text
    style:
      width: 100
      height: 30
      fontSize: 14
      fontWeight: 600
      textAlign: center
      padding: 0
      color: var(--topoviewer-fg-strong)
      backgroundColor: transparent
      borderWidth: 0
      zIndex: 12
