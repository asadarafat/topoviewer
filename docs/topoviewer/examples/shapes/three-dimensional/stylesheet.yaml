version: '0.2'
layout:
  mode: manual
  width: 860
  height: 340
stylesheet:
  - selector: shape
    style:
      fill: 'color-mix(in srgb, #8b78b8 16%, var(--topoviewer-panel-bg))'
      stroke: 'color-mix(in srgb, #8b78b8 86%, transparent)'
      borderWidth: 2
      width: 78
      height: 78
      selectable: true
      zIndex: 8
      labelFontSize: 14
      labelFontWeight: 600
      bodyFontSize: 13
      bodyLineHeight: 1.5
      labelColor: transparent
  - selector: shape[labels.geometry = "cube"]
    style:
      shape: cube
  - selector: shape[labels.geometry = "cuboid"]
    style:
      shape: cuboid
      width: 100
      height: 60
  - selector: shape[labels.geometry = "sphere"]
    style:
      shape: sphere
  - selector: shape[labels.geometry = "cone"]
    style:
      shape: cone
  - selector: shape[labels.geometry = "cylinder"]
    style:
      shape: cylinder
  - selector: shape[labels.geometry = "pyramid"]
    style:
      shape: pyramid
  - selector: shape[labels.geometry = "prism"]
    style:
      shape: prism
  - selector: text
    style:
      width: 100
      height: 30
      fontSize: 14
      fontWeight: 600
      textAlign: center
      padding: 0
      color: var(--topoviewer-fg-strong)
      backgroundColor: transparent
      borderWidth: 0
      zIndex: 12
