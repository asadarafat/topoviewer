version: "0.2"
layout:
  mode: manual
  width: 640
  height: 340
icons:
  node:
    glyph: N
    fill: "#26313c"
    stroke: "#a3b0bd"
labelFields:
  - labels.name
stylesheet:
  - selector: node
    style:
      icon: node
      width: 84
      height: 60
      borderWidth: 2
      labelColor: var(--topoviewer-fg-strong)
      labelFontWeight: 600
      labelFontSize: 14
      metaColor: transparent
      backgroundColor: var(--topoviewer-panel-bg)
      borderColor: var(--topoviewer-edge-default)
      iconColor: var(--topoviewer-fg-strong)
  - selector: link
    style:
      curveStyle: bezier
      lineWidth: 5
      targetArrowShape: triangle
      targetArrowSize: 12
      labelColor: var(--topoviewer-fg-strong)
      textBackgroundColor: var(--topoviewer-edge-label-bg)
      labelFontSize: 12
      labelFontWeight: 600
  - selector: link[labels.mode = "active"]
    style:
      label: gradient
      lineFill: linearGradient
      lineGradientStopColors:
        - "var(--topoviewer-info)"
        - "var(--topoviewer-info)"
        - "var(--topoviewer-warning)"
      lineGradientStopPositions:
        - 0%
        - 58%
        - 100%
      targetArrowColor: "var(--topoviewer-warning)"
  - selector: link[labels.mode = "reference"]
    style:
      label: non-interactive
      lineColor: "var(--topoviewer-accent)"
      lineDashPattern: 6 5
      targetArrowColor: "var(--topoviewer-accent)"
      interactive: false
      labelInteractive: false
