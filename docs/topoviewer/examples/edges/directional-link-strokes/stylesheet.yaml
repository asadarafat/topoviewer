version: "0.2"
layout:
  mode: manual
  width: 640
  height: 320
icons:
  router.generic:
    glyph: R
    fill: "#26313c"
    stroke: "#a3b0bd"
    svg: |
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="#f2f5f8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="48" height="48" rx="6" fill="#26313c" stroke="none"/><path d="M8 24h32M24 8v32M8 24l6-6m-6 6 6 6m26-6-6-6m6 6-6 6M24 8l-6 6m6-6 6 6M24 40l-6-6m6 6 6-6"/></svg>
    alt: Router
labelFields:
  - labels.name
stylesheet:
  - selector: node
    style:
      icon: router.generic
      shape: square
      width: 64
      height: 64
      borderWidth: 2
      labelColor: var(--topoviewer-fg-strong)
      labelFontWeight: 600
      metaColor: transparent
      labelFontSize: 14
      backgroundColor: var(--topoviewer-panel-bg)
      borderColor: var(--topoviewer-edge-default)
  - selector: link
    style:
      curveStyle: straight
      lineColor: "var(--topoviewer-edge-default)"
      lineWidth: 16
      lineCap: round
      targetArrowShape: none
      directionalStrokes: true
      directionStartGap: 18
      directionCenterGap: 64
      directionLabelOffset: -30
      textBackgroundColor: var(--topoviewer-edge-label-bg)
      labelColor: var(--topoviewer-fg-strong)
      labelFontSize: 12
      labelFontWeight: 600
  - selector: linkDirection
    style:
      lineCap: round
      labelFontWeight: 600
      labelColor: var(--topoviewer-fg-strong)
      textBackgroundColor: var(--topoviewer-edge-label-bg)
      labelFontSize: 14
      lineWidth: 6
  - selector: linkDirection[direction = "sourceToTarget"]
    style:
      lineColor: "var(--topoviewer-info)"
      targetArrowShape: triangle
      targetArrowColor: "var(--topoviewer-info)"
      targetArrowOffset: 0
  - selector: linkDirection[direction = "targetToSource"]
    style:
      lineColor: "var(--topoviewer-warning)"
      sourceArrowShape: triangle
      sourceArrowColor: "var(--topoviewer-warning)"
      sourceArrowOffset: 0
      lineStyle: dashed
      lineDashPattern: 12 8
