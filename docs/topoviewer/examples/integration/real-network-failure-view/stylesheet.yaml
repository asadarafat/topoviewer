version: '0.2'
layout:
  mode: manual
  width: 980
  height: 520
icons:
  router.pe:
    glyph: PE
    fill: '#26313c'
    stroke: '#a3b0bd'
  router.p:
    glyph: P
    fill: '#26313c'
    stroke: '#a3b0bd'
  router.rr:
    glyph: RR
    fill: '#26313c'
    stroke: '#a3b0bd'
  router.ce:
    glyph: CE
    fill: '#26313c'
    stroke: '#a3b0bd'
labelFields: []
stylesheet:
  - selector: node
    style:
      shape: roundRectangle
      icon: router.p
      width: 112
      height: 82
      iconSize: 52
      backgroundColor: var(--topoviewer-panel-bg)
      borderColor: var(--topoviewer-edge-default)
      borderWidth: 2
      labelColor: var(--topoviewer-fg-strong)
      labelFontSize: 14
      labelFontWeight: 600
      labelBackgroundColor: var(--topoviewer-panel-bg)
      labelPadding: 4
      metaColor: transparent
      metaFontSize: 0
      statusColor: var(--topoviewer-success)
      statusPlacement: topRight
      statusSize: 11
      iconColor: var(--topoviewer-fg-strong)
  - selector: node[labels.role = "pe"]
    style:
      icon: router.pe
      shape: hexagon
      borderColor: var(--topoviewer-accent)
      underlayColor: color-mix(in srgb, var(--topoviewer-accent) 18%, var(--topoviewer-panel-bg))
      underlayOpacity: 0.24
      underlayPadding: 8
  - selector: node[labels.role = "p"]
    style:
      icon: router.p
      shape: ellipse
      borderColor: var(--topoviewer-info)
  - selector: node[labels.role = "rr"]
    style:
      icon: router.rr
      shape: diamond
      borderColor: '#8b78b8'
      badgeLabel: RR
      badgeBackgroundColor: 'color-mix(in srgb, #8b78b8 12%, var(--topoviewer-panel-bg))'
      badgeColor: var(--topoviewer-fg-strong)
      badgeBorderColor: var(--topoviewer-accent)
      underlayColor: color-mix(in srgb, var(--topoviewer-accent) 18%, var(--topoviewer-panel-bg))
      underlayOpacity: 0.16
      underlayPadding: 8
  - selector: node[labels.role = "ce"]
    style:
      icon: router.ce
      shape: rectangle
      width: 94
      height: 64
      iconSize: 38
      borderColor: var(--topoviewer-warning)
      badgeLabel: VPN
      badgeBackgroundColor: color-mix(in srgb, var(--topoviewer-warning) 12%, var(--topoviewer-panel-bg))
      badgeColor: var(--topoviewer-fg-strong)
      badgeBorderColor: var(--topoviewer-warning)
      underlayColor: color-mix(in srgb, var(--topoviewer-warning) 18%, var(--topoviewer-panel-bg))
      underlayOpacity: 0.72
      underlayPadding: 8
  - selector: node[data.severity = "critical"]
    style:
      statusColor: var(--topoviewer-danger)
      outlineColor: var(--topoviewer-danger)
      outlineWidth: 6
      outlineOpacity: 1
      badgeLabel: CRIT
      badgeBackgroundColor: color-mix(in srgb, var(--topoviewer-danger) 12%, var(--topoviewer-panel-bg))
      badgeColor: var(--topoviewer-fg-strong)
      badgeBorderColor: var(--topoviewer-danger)
  - selector: node[data.severity = "major"]
    style:
      statusColor: var(--topoviewer-warning)
      outlineColor: var(--topoviewer-warning)
      outlineWidth: 5
      outlineOpacity: 0.94
      badgeLabel: MAJ
      badgeBackgroundColor: color-mix(in srgb, var(--topoviewer-warning) 12%, var(--topoviewer-panel-bg))
      badgeColor: var(--topoviewer-fg-strong)
      badgeBorderColor: var(--topoviewer-warning)
  - selector: link
    style:
      curveStyle: straight
      lineColor: var(--topoviewer-edge-default)
      lineWidth: 4
      targetArrowShape: none
      labelColor: var(--topoviewer-fg-strong)
      labelFontSize: 12
      textBackgroundColor: var(--topoviewer-edge-label-bg)
      labelFontWeight: 600
  - selector: link[labels.layer = "underlay"]
    style:
      curveStyle: straight
      lineColor: var(--topoviewer-accent)
      lineWidth: 4
  - selector: link[labels.protocol = "bgp"]
    style:
      label: BGP
      sourceLabel: iBGP
      targetLabel: RR
      curveStyle: unbundled-bezier
      lineColor: '#8b78b8'
      lineWidth: 2
      lineStyle: dashed
      lineDashPattern: 7 7
      lineOpacity: 0.42
      targetArrowShape: none
      targetArrowColor: '#8b78b8'
      sourceLabelColor: var(--topoviewer-fg-strong)
      targetLabelColor: var(--topoviewer-fg-strong)
      textBackgroundColor: var(--topoviewer-edge-label-bg)
      sourceArrowShape: none
  - selector: link[labels.tenant = "payments"]
    style:
      label: access
      curveStyle: smooth-taxi
      lineColor: var(--topoviewer-warning)
      lineWidth: 5
      lineOpacity: 0.95
      targetArrowShape: triangle
      targetArrowColor: var(--topoviewer-warning)
      textBackgroundColor: var(--topoviewer-edge-label-bg)
      labelColor: var(--topoviewer-fg-strong)
  - selector: link[data.severity = "critical"]
    style:
      label: fiber cut
      lineColor: var(--topoviewer-danger)
      lineWidth: 6
      lineStyle: dashed
      lineDashPattern: 10 6
      lineOpacity: 1
  - selector: link[data.severity = "major"]
    style:
      label: degraded
      lineColor: var(--topoviewer-warning)
      lineWidth: 5
      lineOpacity: 1
  - selector: path[labels.path = "transport"]
    style:
      label: SR transport
      curveStyle: smooth-taxi
      lineColor: var(--topoviewer-info)
      lineWidth: 4
      lineOpacity: 0.72
      pipe: true
      pipeWidth: 26
      pipeFill: '#0288d1'
      pipeBorderColor: var(--topoviewer-info)
      pipeOpacity: 0.14
      targetArrowShape: triangle
      targetArrowColor: var(--topoviewer-info)
      textBackgroundColor: var(--topoviewer-edge-label-bg)
      labelColor: var(--topoviewer-fg-strong)
      labelFontSize: 12
  - selector: path[labels.service = "payments"]
    style:
      label: Payments L3VPN
      curveStyle: smooth-taxi
      lineColor: var(--topoviewer-danger)
      lineWidth: 4
      laneWidth: 8
      laneGap: 10
      lineOpacity: 0.98
      targetArrowShape: triangle
      targetArrowColor: var(--topoviewer-danger)
      animated: true
      textBackgroundColor: var(--topoviewer-edge-label-bg)
      labelColor: var(--topoviewer-fg-strong)
      labelFontSize: 12
  - selector: path[data.severity = "critical"]
    style:
      label: impacted service
      lineColor: var(--topoviewer-danger)
      lineWidth: 5
      lineDashPattern: 8 6
      targetArrowColor: var(--topoviewer-danger)
  - selector: region
    style:
      backgroundColor: var(--topoviewer-region-fill)
      borderColor: var(--topoviewer-region-stroke)
      borderWidth: 1
      labelColor: var(--topoviewer-region-label-fg)
      labelFontSize: 14
      labelFontWeight: 600
      labelPosition: topCenter
      labelMargin: 12
      zIndex: -20
      selectable: true
      draggable: true
      headerPadding: 48
  - selector: region[id = "fra-metro"]
    style:
      headerPadding: 48
      nodeHeight: 82
      nodeWidth: 112
      paddingX: 28
      paddingY: 24
  - selector: region[id = "transit-core"]
    style:
      headerPadding: 48
      nodeHeight: 82
      nodeWidth: 112
      paddingX: 34
      paddingY: 28
  - selector: region[id = "lon-metro"]
    style:
      headerPadding: 48
      nodeHeight: 82
      nodeWidth: 112
      paddingX: 28
      paddingY: 24
