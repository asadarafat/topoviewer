version: '0.2'
layout:
  mode: manual
  width: 940
  height: 560
icons:
  client:
    alt: Browser client
    svg: >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#e6edf3"
      stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="24"
      height="24" rx="3" fill="#26313c" stroke="none"/><rect x="3" y="4" width="18" height="13" rx="2"/><path
      d="M8 21h8M12 17v4"/></svg>
    glyph: UI
    fill: '#26313c'
    stroke: '#a3b0bd'
  service:
    alt: Service endpoint
    svg: >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#87b6af"
      stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="24"
      height="24" rx="3" fill="#26313c" stroke="none"/><path d="m12 2 9 5v10l-9 5-9-5V7z"/><path d="M3 7l9 5
      9-5M12 12v10"/></svg>
    glyph: SVC
    fill: '#26313c'
    stroke: '#a3b0bd'
  deployment:
    alt: Deployment
    svg: >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#b4a3d3"
      stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="24"
      height="24" rx="3" fill="#26313c" stroke="none"/><rect x="3" y="3" width="13" height="13" rx="2"/><rect
      x="8" y="8" width="13" height="13" rx="2" fill="#26313c"/><path d="M11 12h7M11 16h5"/></svg>
    glyph: DEP
    fill: '#26313c'
    stroke: '#a3b0bd'
  resource:
    alt: Managed topology resource
    svg: >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#87b6af"
      stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="24"
      height="24" rx="3" fill="#26313c" stroke="none"/><rect x="3" y="5" width="18" height="14" rx="2"/><path
      d="M6 10h3M15 10h3M8 14l4-3 4 3M12 11v5"/></svg>
    glyph: CR
    fill: '#26313c'
    stroke: '#a3b0bd'
  pod:
    alt: Pod
    svg: >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#87b6af"
      stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="24"
      height="24" rx="3" fill="#26313c" stroke="none"/><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9zM4 7.5l8 4.5
      8-4.5M12 12v9"/></svg>
    glyph: POD
    fill: '#26313c'
    stroke: '#a3b0bd'
  group:
    alt: Expandable runtime group
    svg: >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#87b6af"
      stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="24"
      height="24" rx="3" fill="#26313c" stroke="none"/><rect x="8" y="2" width="8" height="6" rx="1"/><rect
      x="2" y="16" width="8" height="6" rx="1"/><rect x="14" y="16" width="8" height="6" rx="1"/><path d="M12
      8v4M6 16v-4h12v4"/></svg>
    glyph: MAP
    fill: '#26313c'
    stroke: '#a3b0bd'
labelFields:
  - labels.name
stylesheet:
  - selector: node
    style:
      shape: roundRectangle
      width: 168
      height: 82
      backgroundColor: var(--topoviewer-panel-bg)
      borderColor: var(--topoviewer-edge-default)
      borderWidth: 2
      labelColor: var(--topoviewer-fg-strong)
      labelFontSize: 14
      labelFontWeight: 600
      metaFontSize: 12
      metaColor: var(--topoviewer-fg-muted)
      iconColor: var(--topoviewer-border-strong)
      nodeLayout:
        type: card
        direction: horizontal
        icon:
          placement: left
          width: 28
          height: 28
        content:
          align: left
          titleField: labels.name
          subtitleField: data.subtitle
  - selector: node[labels.object = "client"]
    style:
      icon: client
      borderColor: var(--topoviewer-accent)
  - selector: node[labels.object = "service"]
    style:
      icon: service
      borderColor: var(--topoviewer-info)
  - selector: node[labels.object = "deployment"]
    style:
      icon: deployment
      borderColor: var(--topoviewer-accent)
  - selector: node[labels.object = "toponode"]
    style:
      icon: resource
      borderColor: var(--topoviewer-info)
  - selector: node[labels.object = "pod"]
    style:
      icon: pod
      borderColor: var(--topoviewer-info)
  - selector: node[isAggregate = "true"][aggregateId = "managed-runtime"]
    style:
      icon: group
      width: 230
      height: 86
      backgroundColor: color-mix(in srgb, var(--topoviewer-info) 12%, var(--topoviewer-panel-bg))
      borderColor: var(--topoviewer-info)
      borderWidth: 2
      labelColor: var(--topoviewer-fg-strong)
      labelFontSize: 14
      metaFontSize: 0
      badgeColor: var(--topoviewer-fg-strong)
      badgeBackgroundColor: color-mix(in srgb, var(--topoviewer-info) 12%, var(--topoviewer-panel-bg))
      badgeBorderColor: var(--topoviewer-info)
      badgeBorderWidth: 1
      badgeFontSize: 12
      badgeFontWeight: 700
      badgeMinWidth: 24
      badgeMinHeight: 24
      badgeOffset: 5
  - selector: link
    style:
      curveStyle: smooth-step
      lineColor: var(--topoviewer-edge-default)
      lineWidth: 2
      targetArrowShape: triangle
      targetArrowColor: var(--topoviewer-info)
      labelColor: var(--topoviewer-fg-strong)
      labelFontSize: 12
      labelFontWeight: 600
      textBackgroundColor: color-mix(in srgb, var(--topoviewer-accent) 12%, var(--topoviewer-panel-bg))
      textBackgroundOpacity: 0.94
      textBackgroundPadding: 4
  - selector: link[labels.relation = "template-match"]
    style:
      lineColor: var(--topoviewer-info)
      targetArrowColor: var(--topoviewer-info)
      lineStyle: dashed
  - selector: link[labels.relation = "binding"]
    style:
      lineColor: var(--topoviewer-info)
      targetArrowColor: var(--topoviewer-info)
  - selector: link[labels.relation = "workload-association"]
    style:
      lineColor: var(--topoviewer-info)
      targetArrowColor: var(--topoviewer-info)
      lineStyle: dashed
  - selector: link[labels.relation = "control"]
    style:
      lineColor: var(--topoviewer-accent)
      targetArrowColor: var(--topoviewer-accent)
  - selector: link[labels.relation = "context"]
    style:
      lineColor: var(--topoviewer-accent)
      targetArrowColor: var(--topoviewer-accent)
      lineStyle: dashed
      lineDashPattern: 6 5
  - selector: link[isAggregate = "true"]
    style:
      lineColor: var(--topoviewer-accent)
      targetArrowColor: var(--topoviewer-accent)
      lineStyle: dashed
      lineDashPattern: 6 5
  - selector: region
    style:
      backgroundColor: var(--topoviewer-region-fill)
      borderColor: var(--topoviewer-region-stroke)
      borderWidth: 1
      borderRadius: 14
      labelColor: var(--topoviewer-fg-strong)
      labelFontSize: 14
      labelFontWeight: 600
      padding: 24
      zIndex: -20
      headerPadding: 48
  - selector: link[labels.relation = "shared-selector"]
    style:
      lineStyle: dashed
      sourceArrowShape: none
      targetArrowShape: none
      lineColor: var(--topoviewer-edge-default)
  - selector: link[labels.relation = "entry"]
    style:
      labelYOffset: -60
  - selector: link[labels.relation = "binding"]
    style:
      labelYOffset: -60
  - selector: link[labels.relation = "template-match"]
    style:
      labelYOffset: -60
  - selector: link[labels.relation = "shared-selector"]
    style:
      labelYOffset: -60
  - selector: link[labels.relation = "workload-association"]
    style:
      labelYOffset: -60
