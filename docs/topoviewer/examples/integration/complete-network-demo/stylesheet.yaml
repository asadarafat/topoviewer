labelFields:
  - labels.name
stylesheet:
  - selector: node
    style:
      icon: router.generic
      width: 82
      height: 60
      backgroundColor: var(--topoviewer-panel-bg)
      borderColor: var(--topoviewer-edge-default)
      borderWidth: 2
      zIndex: 10
      draggable: true
      selectable: true
      labelFontSize: 16
      labelFontWeight: 600
      metaColor: transparent
      labelTextMaxWidth: 150
  - selector: node[labels.vendor = "nokia"]
    style:
      icon: router.nokia
      iconSize: 46
      backgroundColor: transparent
      borderWidth: 0
      shape: rectangle
  - selector: node[labels.vendor = "cisco"]
    style:
      icon: router.cisco
  - selector: node[labels.vendor = "juniper"]
    style:
      icon: router.juniper
  - selector: node[labels.app = "nsp"]
    style:
      icon: controller.nsp
      iconSize: 48
      backgroundColor: transparent
      borderWidth: 0
  - selector: node[labels.node = "service"][labels.service = "l3vpn"]
    style:
      icon: service.l3vpn
      width: 104
      zIndex: 20
      height: 42
      iconSize: 24
      labelFontSize: 14
      labelPosition: center
      iconOpacity: 0
  - selector: link[labels.link = "physical"]
    style:
      label: Physical
      curveStyle: straight
      lineColor: var(--topoviewer-fg-muted)
      lineWidth: 1
      targetArrowShape: none
      opacity: 0.88
  - selector: link[labels.protocol = "bgp-ls"]
    style:
      label: BGP-LS
      curveStyle: taxi
      lineColor: var(--topoviewer-info)
      lineWidth: 1
      lineDashPattern: 3 6
      targetArrowShape: triangle
  - selector: link[labels.protocol = "pcep"]
    style:
      label: PCEP
      curveStyle: unbundled-bezier
      lineColor: var(--topoviewer-accent)
      lineWidth: 1
      lineDashPattern: 3 6
      targetArrowShape: none
      sourceArrowShape: none
  - selector: link[labels.link = "service"]
    style:
      label: Service overlay
      curveStyle: bezier
      lineColor: var(--topoviewer-focus)
      lineWidth: 1
      targetArrowShape: triangle
  - selector: path[labels.protocol = "sr-te"]
    style:
      label: Transport path
      curveStyle: smooth-taxi
      lineColor: var(--topoviewer-focus)
      lineWidth: 1
      targetArrowShape: triangle
      animated: true
      opacity: 0.9
  - selector: region
