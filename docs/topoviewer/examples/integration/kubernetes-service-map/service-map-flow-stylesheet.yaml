version: "0.2"
layout:
  mode: manual
  width: 1800
  height: 420
icons:
  source:
    glyph: API
    fill: "#26313c"
    stroke: "#a3b0bd"
  collector:
    glyph: RUN
    fill: "#26313c"
    stroke: "#a3b0bd"
  artifact:
    glyph: ARTIFACT
    fill: "#26313c"
    stroke: "#a3b0bd"
  model:
    glyph: ID
    fill: "#26313c"
    stroke: "#a3b0bd"
  renderer:
    glyph: TV
    fill: "#26313c"
    stroke: "#a3b0bd"
  controls:
    glyph: UX
    fill: "#26313c"
    stroke: "#a3b0bd"
  map:
    glyph: MAP
    fill: "#26313c"
    stroke: "#a3b0bd"
labelFields:
  - labels.name
stylesheet:
  - selector: region
    style:
      backgroundColor: "var(--topoviewer-region-fill)"
      borderColor: "var(--topoviewer-region-stroke)"
      borderWidth: 1
      labelColor: var(--topoviewer-region-label-fg)
      labelBackgroundColor: var(--topoviewer-region-label-bg)
      labelPosition: topCenter
      labelMargin: 10
      labelFontWeight: 600
      labelFontSize: 18
      headerPadding: 48
  - selector: node
    style:
      shape: rectangle
      width: 126
      height: 62
      borderWidth: 2
      iconFit: contain
      labelFontWeight: 600
      labelColor: var(--topoviewer-fg-strong)
      labelBackgroundColor: var(--topoviewer-panel-bg)
      labelBackgroundOpacity: 0
      labelBorderColor: var(--topoviewer-border)
      labelBorderWidth: 0
      labelPadding: 4
      metaColor: transparent
      labelFontSize: 18
      iconOpacity: 0
      labelPosition: center
      labelTextMaxWidth: 200
      backgroundColor: var(--topoviewer-panel-bg)
      borderColor: var(--topoviewer-edge-default)
      iconColor: var(--topoviewer-fg-strong)
  - selector: node[labels.object = "source"]
    style:
      icon: source
      backgroundColor: "color-mix(in srgb, var(--topoviewer-accent) 12%,
        var(--topoviewer-panel-bg))"
      borderColor: "var(--topoviewer-accent)"
  - selector: node[labels.object = "process"]
    style:
      icon: collector
      backgroundColor: "color-mix(in srgb, #8b78b8 12%, var(--topoviewer-panel-bg))"
      borderColor: "#8b78b8"
  - selector: node[labels.object = "parentProcess"]
    style:
      icon: collector
      backgroundColor: "color-mix(in srgb, #8b78b8 12%, var(--topoviewer-panel-bg))"
      borderColor: "#8b78b8"
      width: 210
      height: 230
      labelPosition: top
  - selector: node[labels.role = "converterStep"]
    style:
      labelPosition: center
      labelBackgroundOpacity: 0
      labelBorderWidth: 0
  - selector: node[labels.role = "contract"]
    style:
      labelPosition: center
      labelBackgroundOpacity: 0
      labelBorderWidth: 0
  - selector: node[labels.object = "artifact"]
    style:
      icon: artifact
      backgroundColor: "color-mix(in srgb, var(--topoviewer-info) 12%,
        var(--topoviewer-panel-bg))"
      borderColor: "var(--topoviewer-info)"
  - selector: node[labels.object = "model"]
    style:
      icon: model
      backgroundColor: "color-mix(in srgb, var(--topoviewer-info) 12%,
        var(--topoviewer-panel-bg))"
      borderColor: "var(--topoviewer-info)"
  - selector: node[labels.object = "renderer"]
    style:
      icon: renderer
      backgroundColor: "color-mix(in srgb, var(--topoviewer-warning) 12%,
        var(--topoviewer-panel-bg))"
      borderColor: "var(--topoviewer-warning)"
  - selector: node[labels.object = "behavior"]
    style:
      icon: controls
      backgroundColor: "color-mix(in srgb, var(--topoviewer-danger) 12%,
        var(--topoviewer-panel-bg))"
      borderColor: "var(--topoviewer-border-strong)"
  - selector: node[labels.object = "output"]
    style:
      icon: map
      backgroundColor: "color-mix(in srgb, var(--topoviewer-info) 12%,
        var(--topoviewer-panel-bg))"
      borderColor: "var(--topoviewer-info)"
      width: 152
  - selector: link
    style:
      curveStyle: bezier
      lineColor: "var(--topoviewer-edge-default)"
      lineWidth: 3
      targetArrowShape: triangle
      targetArrowColor: "var(--topoviewer-accent)"
      labelColor: var(--topoviewer-fg-strong)
      labelFontSize: 12
      labelFontWeight: 600
      textBackgroundColor: var(--topoviewer-edge-label-bg)
      textBackgroundOpacity: 0.94
  - selector: link[labels.link = "collect"]
    style:
      label: collect
      lineColor: "var(--topoviewer-accent)"
      targetArrowColor: "var(--topoviewer-accent)"
  - selector: link[labels.link = "snapshot"]
    style:
      label: snapshot
      lineColor: "var(--topoviewer-info)"
      targetArrowColor: "var(--topoviewer-info)"
  - selector: link[labels.link = "convert"]
    style:
      label: convert
      lineColor: "#8b78b8"
      targetArrowColor: "#8b78b8"
  - selector: link[labels.link = "derive"]
    style:
      label: derive model
      lineColor: "var(--topoviewer-info)"
      targetArrowColor: "var(--topoviewer-info)"
  - selector: link[labels.link = "write"]
    style:
      label: write topology
      lineColor: "var(--topoviewer-info)"
      targetArrowColor: "var(--topoviewer-info)"
  - selector: link[labels.link = "input"]
    style:
      label: input
      lineColor: "var(--topoviewer-warning)"
      targetArrowColor: "var(--topoviewer-warning)"
  - selector: link[labels.link = "interaction"]
    style:
      label: layer/attention
      lineColor: "var(--topoviewer-danger)"
      targetArrowColor: "var(--topoviewer-danger)"
  - selector: link[labels.link = "render"]
    style:
      label: render
      lineColor: "var(--topoviewer-info)"
      targetArrowColor: "var(--topoviewer-info)"
  - selector: link[labels.link = "refine"]
    style:
      label: refine view
      lineColor: "var(--topoviewer-danger)"
      targetArrowColor: "var(--topoviewer-danger)"
      lineStyle: dashed
  - selector: region[id = "source-systems"]
    style:
      paddingX: 48
      paddingY: 44
  - selector: region[id = "generated-yaml"]
    style:
      paddingX: 64
      paddingY: 58
  - selector: region[id = "rendered-output"]
    style:
      paddingX: 44
      paddingY: 48
