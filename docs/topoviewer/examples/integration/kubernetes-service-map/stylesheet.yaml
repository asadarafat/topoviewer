version: '0.2'
layout:
  mode: manual
  width: 2120
  height: 1900
icons:
  client:
    glyph: UI
    fill: '#26313c'
    stroke: '#a3b0bd'
  service:
    glyph: SVC
    fill: '#26313c'
    stroke: '#a3b0bd'
  deploy:
    glyph: DEP
    fill: '#26313c'
    stroke: '#a3b0bd'
  pod:
    glyph: POD
    fill: '#26313c'
    stroke: '#a3b0bd'
  data:
    glyph: DB
    fill: '#26313c'
    stroke: '#a3b0bd'
  fabric:
    glyph: SRL
    fill: '#26313c'
    stroke: '#a3b0bd'
  resource:
    glyph: CR
    fill: '#26313c'
    stroke: '#a3b0bd'
  replicaSet:
    glyph: RS
    fill: '#26313c'
    stroke: '#a3b0bd'
  group:
    alt: Expandable runtime group
    svg: >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#87b6af"
      stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="24"
      height="24" rx="3" fill="#26313c" stroke="none"/><rect x="8" y="2" width="8" height="6" rx="1"/><rect
      x="2" y="16" width="8" height="6" rx="1"/><rect x="14" y="16" width="8" height="6" rx="1"/><path d="M12
      8v4M6 16v-4h12v4"/></svg>
    glyph: MAP
    fill: '#26313c'
    stroke: '#a3b0bd'
labelFields:
  - labels.name
stylesheet:
  - selector: region
    style:
      backgroundColor: var(--topoviewer-region-fill)
      borderColor: var(--topoviewer-region-stroke)
      borderWidth: 2
      draggable: true
      selectable: true
      labelPosition: topCenter
      labelMargin: 12
      labelColor: var(--topoviewer-region-label-fg)
      labelBackgroundColor: var(--topoviewer-region-label-bg)
      labelZIndex: 6
      labelFontSize: 14
      labelFontWeight: 600
      headerPadding: 48
  - selector: node
    style:
      shape: rectangle
      width: 104
      height: 58
      borderWidth: 2
      iconFit: fill
      iconPadding: 0
      labelColor: var(--topoviewer-fg-strong)
      labelFontWeight: 600
      labelBackgroundColor: var(--topoviewer-panel-bg)
      labelBackgroundOpacity: 0.92
      labelPadding: 4
      metaColor: transparent
      labelFontSize: 14
      backgroundColor: var(--topoviewer-panel-bg)
      borderColor: var(--topoviewer-edge-default)
      iconColor: var(--topoviewer-fg-strong)
  - selector: node[labels.object = "client"]
    style:
      icon: client
      backgroundColor: color-mix(in srgb, var(--topoviewer-accent) 12%, var(--topoviewer-panel-bg))
      borderColor: var(--topoviewer-accent)
      width: 92
      height: 56
  - selector: node[labels.object = "service"]
    style:
      icon: service
      backgroundColor: color-mix(in srgb, var(--topoviewer-accent) 12%, var(--topoviewer-panel-bg))
      borderColor: var(--topoviewer-accent)
  - selector: node[labels.object = "deployment"]
    style:
      icon: deploy
      backgroundColor: color-mix(in srgb, var(--topoviewer-info) 12%, var(--topoviewer-panel-bg))
      borderColor: var(--topoviewer-info)
  - selector: node[labels.object = "pod"]
    style:
      icon: pod
      backgroundColor: color-mix(in srgb, var(--topoviewer-info) 12%, var(--topoviewer-panel-bg))
      borderColor: var(--topoviewer-info)
  - selector: node[labels.object = "toponode"]
    style:
      icon: fabric
      backgroundColor: color-mix(in srgb, var(--topoviewer-accent) 12%, var(--topoviewer-panel-bg))
      borderColor: var(--topoviewer-accent)
      width: 112
      height: 64
  - selector: node[labels.object = "edaResource"]
    style:
      icon: resource
      backgroundColor: color-mix(in srgb, var(--topoviewer-warning) 12%, var(--topoviewer-panel-bg))
      borderColor: var(--topoviewer-warning)
      width: 132
      height: 62
  - selector: node[isAggregate = "true"]
    style:
      shape: roundRectangle
      width: 380
      height: 100
      backgroundColor: var(--topoviewer-panel-bg)
      borderColor: var(--topoviewer-border)
      borderWidth: 3
      labelPosition: center
      labelFontWeight: 600
      badgeBackgroundColor: color-mix(in srgb, var(--topoviewer-accent) 12%, var(--topoviewer-panel-bg))
      badgeColor: var(--topoviewer-fg-strong)
      badgeBorderColor: var(--topoviewer-accent)
      statusPlacement: topRight
      statusSize: 12
      outlineColor: var(--topoviewer-accent)
      outlineWidth: 3
      outlineOpacity: 0.55
      underlayColor: color-mix(in srgb, var(--topoviewer-accent) 18%, var(--topoviewer-panel-bg))
      underlayPadding: 10
      underlayOpacity: 0.18
      labelFontSize: 28
      labelTextMaxWidth: 420
      metaColor: transparent
      iconOpacity: 0
      badgeFontSize: 22
      badgeMinWidth: 30
      badgeMinHeight: 30
      icon: group
  - selector: node[labels.role = "database"]
    style:
      icon: data
      backgroundColor: 'color-mix(in srgb, #8b78b8 12%, var(--topoviewer-panel-bg))'
      borderColor: '#8b78b8'
  - selector: node[labels.status = "ready"]
    style:
      statusColor: var(--topoviewer-success)
  - selector: node[labels.status = "connected"]
    style:
      statusColor: var(--topoviewer-success)
      badgeLabel: NPP
  - selector: link
    style:
      curveStyle: bezier
      lineColor: var(--topoviewer-edge-default)
      lineWidth: 2
      targetArrowShape: triangle
      targetArrowColor: var(--topoviewer-info)
      labelColor: var(--topoviewer-fg-strong)
      labelFontSize: 12
      textBackgroundColor: var(--topoviewer-edge-label-bg)
      labelZIndex: 8
      labelFontWeight: 600
  - selector: link[labels.link = "entry"]
    style:
      lineColor: var(--topoviewer-accent)
      targetArrowColor: var(--topoviewer-accent)
      lineWidth: 4
      label: HTTPS
  - selector: link[labels.link = "runtime-flow"]
    style:
      curveStyle: bezier
      lineColor: var(--topoviewer-accent)
      targetArrowColor: var(--topoviewer-accent)
      lineWidth: 3
  - selector: link[labels.link = "template-match"]
    style:
      lineColor: var(--topoviewer-info)
      targetArrowColor: var(--topoviewer-info)
      lineWidth: 3
      label: template match
      lineStyle: dashed
  - selector: link[labels.link = "domain-grouping"]
    style:
      lineColor: var(--topoviewer-warning)
      targetArrowColor: var(--topoviewer-warning)
      lineWidth: 3
      label: modeled membership
      lineStyle: dashed
      targetArrowShape: none
  - selector: link[labels.link = "runtime-binding"]
    style:
      lineColor: '#8b78b8'
      targetArrowColor: '#8b78b8'
      lineWidth: 3
      lineStyle: dashed
  - selector: link[labels.link = "control"]
    style:
      lineColor: var(--topoviewer-info)
      targetArrowColor: var(--topoviewer-info)
      lineWidth: 2
      lineStyle: dashed
      label: NPP
  - selector: link[labels.link = "workload-association"]
    style:
      lineColor: var(--topoviewer-info)
      targetArrowColor: var(--topoviewer-info)
      lineWidth: 2
      label: Pod association
      lineStyle: dashed
  - selector: region[id = "region-api-surface"]
    style:
      paddingX: 46
      paddingY: 42
  - selector: region[id = "region-data-identity"]
    style:
      paddingX: 46
      paddingY: 42
  - selector: region[id = "region-control-engine"]
    style:
      paddingX: 46
      paddingY: 42
  - selector: region[id = "region-app-bootstrap"]
    style:
      paddingX: 46
      paddingY: 42
      headerPadding: 120
  - selector: region[id = "region-topology-runtime"]
    style:
      paddingX: 52
      paddingY: 46
  - selector: region[id = "region-simulated-fabric"]
    style:
      paddingX: 52
      paddingY: 46
  - selector: link[labels.link = "shared-selector"]
    style:
      lineStyle: dashed
      sourceArrowShape: none
      targetArrowShape: none
      lineColor: var(--topoviewer-edge-default)
