version: "0.2"
layout:
  mode: manual
  width: 1320
  height: 520
icons:
  input:
    glyph: JSON
    fill: "#26313c"
    stroke: "#a3b0bd"
  converter:
    glyph: CLI
    fill: "#26313c"
    stroke: "#a3b0bd"
  model:
    glyph: ID
    fill: "#26313c"
    stroke: "#a3b0bd"
  artifact:
    glyph: ARTIFACT
    fill: "#26313c"
    stroke: "#a3b0bd"
  policy:
    glyph: CSS
    fill: "#26313c"
    stroke: "#a3b0bd"
  renderer:
    glyph: TV
    fill: "#26313c"
    stroke: "#a3b0bd"
  behavior:
    glyph: UX
    fill: "#26313c"
    stroke: "#a3b0bd"
labelFields:
  - labels.name
stylesheet:
  - selector: region
    style:
      backgroundColor: "var(--topoviewer-region-fill)"
      borderColor: "var(--topoviewer-region-stroke)"
      borderWidth: 1
      labelColor: var(--topoviewer-region-label-fg)
      labelBackgroundColor: var(--topoviewer-region-label-bg)
      labelPosition: topCenter
      labelMargin: 10
      labelFontWeight: 600
      labelZIndex: 6
      labelFontSize: 18
      headerPadding: 48
  - selector: node
    style:
      shape: rectangle
      width: 140
      height: 58
      borderWidth: 2
      iconFit: contain
      labelFontWeight: 600
      labelColor: var(--topoviewer-fg-strong)
      labelBackgroundColor: var(--topoviewer-panel-bg)
      labelBackgroundOpacity: 0
      labelBorderColor: var(--topoviewer-border)
      labelBorderWidth: 0
      labelPadding: 4
      metaColor: transparent
      labelFontSize: 18
      iconOpacity: 0
      labelPosition: center
      labelTextMaxWidth: 200
      backgroundColor: var(--topoviewer-panel-bg)
      borderColor: var(--topoviewer-edge-default)
      iconColor: var(--topoviewer-fg-strong)
  - selector: node[labels.object = "input"]
    style:
      icon: input
      backgroundColor: "color-mix(in srgb, var(--topoviewer-accent) 12%,
        var(--topoviewer-panel-bg))"
      borderColor: "var(--topoviewer-accent)"
  - selector: node[labels.object = "parentProcess"]
    style:
      icon: converter
      backgroundColor: "color-mix(in srgb, #8b78b8 12%, var(--topoviewer-panel-bg))"
      borderColor: "#8b78b8"
      width: 240
      height: 380
      labelPosition: top
      labelYOffset: -4
  - selector: node[labels.object = "process"]
    style:
      icon: converter
      backgroundColor: "color-mix(in srgb, #8b78b8 12%, var(--topoviewer-panel-bg))"
      borderColor: "#8b78b8"
      width: 168
  - selector: node[labels.object = "model"]
    style:
      icon: model
      backgroundColor: "color-mix(in srgb, var(--topoviewer-info) 12%,
        var(--topoviewer-panel-bg))"
      borderColor: "var(--topoviewer-info)"
      width: 168
  - selector: node[labels.object = "behavior"]
    style:
      icon: behavior
      backgroundColor: "color-mix(in srgb, var(--topoviewer-danger) 12%,
        var(--topoviewer-panel-bg))"
      borderColor: "var(--topoviewer-border-strong)"
      width: 152
  - selector: node[labels.role = "read"]
    style:
      labelPosition: center
      labelBackgroundOpacity: 0
      labelBorderWidth: 0
  - selector: node[labels.role = "identity"]
    style:
      labelPosition: center
      labelBackgroundOpacity: 0
      labelBorderWidth: 0
  - selector: node[labels.role = "relationships"]
    style:
      labelPosition: center
      labelBackgroundOpacity: 0
      labelBorderWidth: 0
  - selector: node[labels.role = "attention"]
    style:
      labelPosition: center
      labelBackgroundOpacity: 0
      labelBorderWidth: 0
  - selector: node[labels.object = "artifact"]
    style:
      icon: artifact
      backgroundColor: "color-mix(in srgb, var(--topoviewer-info) 12%,
        var(--topoviewer-panel-bg))"
      borderColor: "var(--topoviewer-info)"
  - selector: node[labels.object = "policy"]
    style:
      icon: policy
      backgroundColor: "color-mix(in srgb, var(--topoviewer-info) 12%,
        var(--topoviewer-panel-bg))"
      borderColor: "var(--topoviewer-info)"
  - selector: node[labels.object = "renderer"]
    style:
      icon: renderer
      backgroundColor: "color-mix(in srgb, var(--topoviewer-warning) 12%,
        var(--topoviewer-panel-bg))"
      borderColor: "var(--topoviewer-warning)"
  - selector: link
    style:
      curveStyle: bezier
      lineColor: "var(--topoviewer-edge-default)"
      lineWidth: 3
      targetArrowShape: triangle
      targetArrowColor: "var(--topoviewer-accent)"
      labelColor: var(--topoviewer-fg-strong)
      labelFontSize: 12
      labelFontWeight: 600
      textBackgroundColor: var(--topoviewer-edge-label-bg)
      textBackgroundOpacity: 0.94
      labelZIndex: 8
  - selector: link[labels.link = "input"]
    style:
      label: read
      lineColor: "var(--topoviewer-accent)"
      targetArrowColor: "var(--topoviewer-accent)"
  - selector: link[labels.link = "derive"]
    style:
      label: derive
      lineColor: "var(--topoviewer-info)"
      targetArrowColor: "var(--topoviewer-info)"
  - selector: link[labels.link = "write"]
    style:
      label: write
      lineColor: "var(--topoviewer-info)"
      targetArrowColor: "var(--topoviewer-info)"
  - selector: link[labels.link = "renderInput"]
    style:
      label: input
      lineColor: "var(--topoviewer-warning)"
      targetArrowColor: "var(--topoviewer-warning)"
  - selector: link[labels.link = "behavior"]
    style:
      label: enables
      lineColor: "var(--topoviewer-danger)"
      targetArrowColor: "var(--topoviewer-danger)"
  - selector: region[id = "inventory-snapshots"]
    style:
      paddingX: 44
      paddingY: 38
  - selector: region[id = "output-contract"]
    style:
      paddingX: 44
      paddingY: 40
