version: "0.2"
layout:
  mode: manual
  width: 780
  height: 420
icons:
  core:
    glyph: C
    fill: "#26313c"
    stroke: "#a3b0bd"
  rr:
    glyph: RR
    fill: "#26313c"
    stroke: "#a3b0bd"
  pe:
    glyph: PE
    fill: "#26313c"
    stroke: "#a3b0bd"
  firewall:
    glyph: FW
    fill: "#26313c"
    stroke: "#a3b0bd"
  service:
    glyph: VPN
    fill: "#26313c"
    stroke: "#a3b0bd"
    svg: |
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="#f2f5f8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="48" height="48" rx="6" fill="#26313c" stroke="none"/><rect x="7" y="9" width="34" height="30" rx="5"/><path d="M15 20h18M15 28h18"/><circle cx="24" cy="24" r="2"/></svg>
    alt: Virtual private network service
  client:
    glyph: C
    fill: "#26313c"
    stroke: "#a3b0bd"
  aggregate:
    glyph: M
    fill: "#26313c"
    stroke: "#a3b0bd"
  switch:
    glyph: SW
    fill: "#26313c"
    stroke: "#a3b0bd"
stylesheet:
  - selector: node
    style:
      width: 98
      height: 78
      iconSize: 52
      borderWidth: 2
      labelFontWeight: 600
      labelColor: var(--topoviewer-fg-strong)
      labelFontSize: 14
      metaColor: transparent
      backgroundColor: var(--topoviewer-panel-bg)
      borderColor: var(--topoviewer-edge-default)
      iconColor: var(--topoviewer-fg-strong)
  - selector: node[labels.role = "core"]
    style:
      icon: core
      shape: circle
      width: 78
      height: 78
  - selector: node[labels.role = "route-reflector"]
    style:
      icon: rr
      shape: diamond
  - selector: node[labels.role = "pe"]
    style:
      icon: pe
      shape: hexagon
  - selector: node[labels.role = "firewall"]
    style:
      icon: firewall
      shape: cutRectangle
  - selector: node[labels.role = "service"]
    style:
      icon: service
      shape: concaveHexagon
  - selector: node[labels.role = "client"]
    style:
      icon: client
      shape: vee
  - selector: node[labels.role = "aggregate"]
    style:
      icon: aggregate
      shape: roundRectangle
  - selector: node[labels.role = "switch"]
    style:
      icon: switch
      shape: square
      width: 78
      height: 78
  - selector: link
    style:
      lineColor: "var(--topoviewer-edge-default)"
      lineWidth: 2
      targetArrowShape: none
      labelFontSize: 12
      labelFontWeight: 600
