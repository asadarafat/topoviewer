version: "0.2"
layout:
  mode: manual
  width: 560
  height: 340
icons:
  collector:
    glyph: T
    fill: "#26313c"
    stroke: "#a3b0bd"
  site:
    glyph: S
    fill: "#26313c"
    stroke: "#a3b0bd"
stylesheet:
  - selector: node
    style:
      width: 108
      height: 82
      iconSize: 58
      borderWidth: 2
      labelFontWeight: 600
      labelColor: var(--topoviewer-fg-strong)
      labelFontSize: 14
      metaColor: transparent
      backgroundColor: var(--topoviewer-panel-bg)
      borderColor: var(--topoviewer-edge-default)
      iconColor: var(--topoviewer-fg-strong)
  - selector: node[labels.role = "collector"]
    style:
      icon: collector
      shape: tag
  - selector: node[labels.role = "site"]
    style:
      icon: site
      shape: polygon
      shapePolygonPoints: "0 -1 0.92 -0.12 0.58 1 -0.58 1 -0.92 -0.12"
  - selector: link
    style:
      lineColor: "var(--topoviewer-edge-default)"
      lineWidth: 2
      lineDashPattern: 6 4
      targetArrowShape: triangle
      labelFontSize: 12
      labelFontWeight: 600
  - selector: node[id = "site-b"]
    style:
      shape: polygon
      shapePolygonPoints:
        - 0
        - -1
        - 0.92
        - -0.12
        - 0.58
        - 1
        - -0.58
        - 1
        - -0.92
        - -0.12
