version: "0.2"
layout:
  mode: manual
  width: 680
  height: 320
icons:
  router:
    glyph: R
    fill: "#2563eb"
    stroke: "#bfdbfe"
  service:
    glyph: VPN
    fill: "#7c3aed"
    stroke: "#ddd6fe"
  controller:
    glyph: NSP
    fill: "#f59e0b"
    stroke: "#fde68a"
labelFields:
  - labels.name
stylesheet:
  - selector: node
    style:
      icon: router
      width: 84
      height: 60
      borderWidth: 3
      labelColor: var(--topoviewer-fg-strong)
      labelFontWeight: 800
  - selector: link
    style:
      label: Link
      lineColor: "#60a5fa"
      lineWidth: 1
      targetArrowShape: none
      labelColor: var(--topoviewer-fg-strong)
      textBackgroundColor: var(--topoviewer-edge-label-bg)
  - selector: node[labels.vendor = "cisco"]
    style:
      shape: roundRectangle
      backgroundColor: "#7c3aed"
      borderColor: "#c4b5fd"
      borderWidth: 4
  - selector: link[labels.protocol = "ethernet"]
    style:
      lineStyle: dashed
      lineDashPattern: 7 7
      lineColor: "#9c27b0"
      lineWidth: 3
