version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    target-branch: development
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security
    reviewers:
      - asadarafat
    assignees:
      - asadarafat
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      npm-ui-runtime:
        applies-to: version-updates
        patterns:
          - "@mui/*"
          - "@xyflow/react"
        update-types:
          - minor
          - patch
      npm-build-tooling:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - vite
          - "@vitejs/plugin-react"
          - rollup
          - rollup-plugin-dts
        update-types:
          - minor
          - patch
      npm-browser-testing:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "@playwright/test"
          - "@axe-core/playwright"
        update-types:
          - minor
          - patch
      npm-grafana-tooling:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "@grafana/*"
          - "@swc/core"
          - css-loader
          - style-loader
          - swc-loader
          - webpack
          - webpack-cli
        update-types:
          - minor
          - patch
      npm-runtime:
        applies-to: version-updates
        dependency-type: production
        exclude-patterns:
          - monaco-editor
          - "@mui/*"
          - "@xyflow/react"
        update-types:
          - minor
          - patch
      npm-development:
        applies-to: version-updates
        dependency-type: development
        exclude-patterns:
          - monaco-editor
          - "@mui/*"
          - "@xyflow/react"
          - vite
          - "@vitejs/plugin-react"
          - rollup
          - rollup-plugin-dts
          - "@playwright/test"
          - "@axe-core/playwright"
          - "@grafana/*"
          - "@swc/core"
          - css-loader
          - style-loader
          - swc-loader
          - webpack
          - webpack-cli
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /packages/grafana-topoviewer-panel
    schedule:
      interval: weekly
      day: monday
      time: "05:20"
    target-branch: development
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    reviewers:
      - asadarafat
    assignees:
      - asadarafat
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: github.com/grafana/grafana-plugin-sdk-go
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:40"
    target-branch: development
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    reviewers:
      - asadarafat
    assignees:
      - asadarafat
    commit-message:
      prefix: chore
      include: scope
